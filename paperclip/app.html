                <div className="daily-bar" style={{width:"100%",height:heightPct+"%"}} title={d.label + ": $" + (d.cost / 100).toFixed(2)}/>
                <div className="daily-label">{d.label}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Recent Cost Events */}
      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>{"최근 비용 이벤트 (" + Math.min(30, data.costEvents.length) + "건)"}</div>
        {recentEvents.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>아직 비용 이벤트가 없습니다. Heartbeat를 실행해보세요!</div>
          : recentEvents.map(function(ev) {
            var agent = data.agents.find(function(a) { return a.id === ev.agentId; });
            var mi = MODELS[ev.model] || { name: ev.model };
            return (
              <div key={ev.id} className="table-row">
                <span style={{fontSize:16}}>{agent ? agent.icon : "🤖"}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div className="text-sm font-medium">{agent ? agent.name : "알 수 없음"}</div>
                  <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{mi.name}{ev.advisorEnabled?" + 🧠"+(MODELS[ev.advisorModel]||{}).name:""}</div>
                </div>
                <span className="token-pill">{(ev.inputTokens || 0) + "+" + (ev.outputTokens || 0)}</span>
                <span className="cost-pill">{"$" + ((ev.costCents || 0) / 100).toFixed(3)}</span>
                <span className="text-sm text-muted" style={{whiteSpace:"nowrap"}}>{new Date(ev.occurredAt).toLocaleString("ko-KR")}</span>
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

function PasswordManager() {
  var hasLock = !!localStorage.getItem(LOCK_KEY);
  const [curPw, setCurPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [newPw2, setNewPw2] = useState("");
  const [msg, setMsg] = useState("");
  const [msgType, setMsgType] = useState("");

  const changePw = async () => {
    if (hasLock) {
      var curHash = await hashPassword(curPw);
      if (curHash !== localStorage.getItem(LOCK_KEY)) { setMsg("현재 비밀번호가 틀렸습니다."); setMsgType("error"); return; }
    }
    if (newPw.length < 4) { setMsg("새 비밀번호는 4자 이상이어야 합니다."); setMsgType("error"); return; }
    if (newPw !== newPw2) { setMsg("새 비밀번호가 일치하지 않습니다."); setMsgType("error"); return; }
    var hash = await hashPassword(newPw);
    localStorage.setItem(LOCK_KEY, hash);
    setCurPw(""); setNewPw(""); setNewPw2("");
    setMsg("비밀번호가 변경되었습니다!"); setMsgType("success");
  };

  const removePw = async () => {
    if (!hasLock) return;
    var curHash = await hashPassword(curPw);
    if (curHash !== localStorage.getItem(LOCK_KEY)) { setMsg("현재 비밀번호가 틀렸습니다."); setMsgType("error"); return; }
    if (!confirm("비밀번호 잠금을 해제하시겠습니까?")) return;
    localStorage.removeItem(LOCK_KEY);
    setCurPw("");
    setMsg("비밀번호가 제거되었습니다."); setMsgType("success");
  };

  return (
    <div>
      <div className="text-sm text-muted" style={{marginBottom:12}}>{hasLock ? "🔒 비밀번호가 설정되어 있습니다." : "🔓 비밀번호가 설정되지 않았습니다."}</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {hasLock && <input className="input" type="password" placeholder="현재 비밀번호" value={curPw} onChange={function(e){setCurPw(e.target.value);setMsg("")}}/>}
        <input className="input" type="password" placeholder="새 비밀번호 (4자 이상)" value={newPw} onChange={function(e){setNewPw(e.target.value);setMsg("")}}/>
        <input className="input" type="password" placeholder="새 비밀번호 확인" value={newPw2} onChange={function(e){setNewPw2(e.target.value);setMsg("")}}/>
        {msg && <div className="text-sm" style={{color:msgType==="error"?"var(--danger)":"var(--success)"}}>{msg}</div>}
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary" onClick={changePw}>{hasLock ? "비밀번호 변경" : "비밀번호 설정"}</button>
          {hasLock && <button className="btn" onClick={removePw} style={{color:"var(--danger)"}}>비밀번호 제거</button>}
        </div>
      </div>
    </div>
  );
}

// ========== Conversations Page ==========
function exportConversationsMarkdown(data, selectedIssueId) {
  var co = data.companies[0];
  var project = data.projects[0];
  var issues = selectedIssueId ? data.issues.filter(function(i){return i.id===selectedIssueId}) : data.issues.filter(function(i){return (i.comments||[]).length > 0});
  var goals = data.goals || [];

  var md = "# " + (project ? project.name : (co ? co.name : "JWAY Paperclip")) + " — 협업 결과 보고서\n\n";
  md += "> 생성일: " + new Date().toLocaleString("ko-KR") + "\n\n";
  if (project && project.description) md += "**프로젝트 설명**: " + project.description + "\n\n";

  // 에이전트 목록
  md += "## 👥 참여 에이전트\n\n";
  md += "| 이름 | 역할 | 모델 |\n|---|---|---|\n";
  data.agents.forEach(function(a) {
    var mi = MODELS[a.adapterConfig ? a.adapterConfig.model : ""] || {name:"?"};
    md += "| " + a.name + " | " + (a.title || a.role) + " | " + mi.name + (a.adapterConfig && a.adapterConfig.advisorEnabled ? " + Advisor" : "") + " |\n";
  });
  md += "\n";

  // 목표
  if (goals.length > 0) {
    md += "## 🎯 목표\n\n";
    goals.forEach(function(g) {
      md += "- **[" + g.level + "]** " + g.title + " — " + g.progress + "% (" + g.status + ")\n";
      if (g.description) md += "  - " + g.description + "\n";
      if (g.targetDate) md += "  - 마감: " + g.targetDate + "\n";
    });
    md += "\n";
  }

  // 이슈별 대화
  md += "## 📋 이슈별 협업 내용\n\n";
  issues.forEach(function(issue) {
    md += "### [" + issue.identifier + "] " + issue.title + "\n\n";
    md += "- **상태**: " + issue.status + " / **우선순위**: " + issue.priority + "\n";
    var assignee = data.agents.find(function(a){return a.id===issue.assigneeAgentId});
    if (assignee) md += "- **담당자**: " + assignee.name + "\n";
    if (issue.description) md += "- **설명**: " + issue.description + "\n";
    md += "\n";
    var comments = issue.comments || [];
    if (comments.length > 0) {
      md += "#### 💬 코멘트 (" + comments.length + "개)\n\n";
      comments.forEach(function(c) {
        var typeLabel = c.type === "delegation" ? "🔀 [재할당]" : c.type === "review" ? "✅ [리뷰]" : "💬";
        md += "**" + typeLabel + " " + c.agentName + "** _" + new Date(c.createdAt).toLocaleString("ko-KR") + "_\n\n";
        md += c.content + "\n\n";
        md += "---\n\n";
      });
    }
  });

  // 비용 요약
  var totalCost = data.costEvents.reduce(function(s,e){return s+(e.costCents||0)}, 0);
  var totalRuns = data.heartbeatRuns.length;
  md += "## 💰 비용 요약\n\n";
  md += "- 총 비용: **$" + (totalCost/100).toFixed(2) + "**\n";
  md += "- 총 실행: " + totalRuns + "회\n";
  md += "- 협업 실행: " + data.heartbeatRuns.filter(function(r){return r.mode==="collaboration"}).length + "회\n";
  var totalComments = data.issues.reduce(function(s,i){return s+(i.comments||[]).length}, 0);
  md += "- 총 코멘트: " + totalComments + "개\n\n";

  md += "---\n\n_Generated by JWAY Paperclip v" + VER + "_\n";
  return md;
}

async function generateSummaryReport(data, apiKey) {

  var goals = data.goals || [];

  // 코멘트가 있는 이슈만 수집
  var issuesWithComments = data.issues.filter(function(i) { return (i.comments || []).length > 0; });

  if (project && project.description) context += "설명: " + project.description + "\n\n";

  context += "\n이슈별 협업 내용:\n";
  issuesWithComments.forEach(function(issue) {
    context += "\n### [" + issue.identifier + "] " + issue.title + " (상태: " + issue.status + ")\n";
    (issue.comments || []).slice(-5).forEach(function(c) {
      context += "[" + c.agentName + "]: " + c.content.substring(0, 500) + "\n";
    });

  var response = await callClaudeAPI(apiKey, "claude-sonnet-4-6", systemPrompt, userMessage, 4096);
  var summary = response.content.map(function(c) { return c.text || ""; }).join("");

  // 최종 보고서: AI 요약 + 메타데이터
  var totalCost = data.costEvents.reduce(function(s,e){return s+(e.costCents||0)}, 0);
  var totalComments = issuesWithComments.reduce(function(s,i){return s+(i.comments||[]).length}, 0);
  var md = summary + "\n\n---\n\n## 📊 메타데이터\n\n";

  md += "- **이슈**: " + data.issues.length + "개 (완료 " + data.issues.filter(function(i){return i.status==='done'}).length + "개)\n";
  md += "- **총 코멘트**: " + totalComments + "개\n";
  md += "- **협업 비용**: $" + (totalCost/100).toFixed(2) + "\n\n";
  md += "_Generated by JWAY Paperclip v" + VER + " (요약 by Sonnet 4.6)_\n";
  return md;
}

// ========== 아티팩트 헬퍼 ==========
var ARTIFACT_MIME = {
  html: "text/html",
  css: "text/css",
  js: "application/javascript",
  json: "application/json",
  markdown: "text/markdown",
  code: "text/plain",
  text: "text/plain",
};
function artifactEmoji(t) {
  return ({ html: "🌐", css: "🎨", js: "⚡", json: "📋", markdown: "📝", code: "💻", text: "📄" })[t] || "📎";
}
function downloadArtifact(a) {
  var mime = (ARTIFACT_MIME[a.type] || "text/plain") + ";charset=utf-8";
  var blob = new Blob([a.content], { type: mime });
  var url = URL.createObjectURL(blob);
  var el = document.createElement("a");
  el.href = url;
  el.download = a.title || "artifact";
  document.body.appendChild(el);
  el.click();
  document.body.removeChild(el);
  URL.revokeObjectURL(url);
}
function previewHtmlArtifact(a) {
  var content = a.type === "markdown" ? renderMarkdownLite(a.content) : a.content;
  var blob = new Blob([content], { type: "text/html;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var w = window.open(url, "_blank", "width=1200,height=800");
  if (!w) { alert("팝업이 차단되었습니다. 브라우저에서 팝업 허용 후 다시 시도하거나 다운로드를 이용하세요."); }
}
// 같은 이슈 내 같은 title을 가진 아티팩트들의 버전 정보 계산
function getArtifactVersions(issue, artifact) {
  if (!issue || !issue.artifacts) return { version: 1, total: 1, all: [artifact] };
  var sameTitle = issue.artifacts.filter(function(a) { return a.title === artifact.title; });
  sameTitle.sort(function(a, b) { return a.createdAt < b.createdAt ? -1 : 1; });
  var version = sameTitle.findIndex(function(a) { return a.id === artifact.id; }) + 1;
  return { version: version, total: sameTitle.length, all: sameTitle };
}

async function exportArtifactsZip(artifacts, zipName) {
  if (typeof JSZip === "undefined") {
    alert("JSZip 라이브러리 로딩 실패. 페이지를 새로고침해 주세요.");
    return;
  }
  if (!artifacts || artifacts.length === 0) {
    alert("내보낼 아티팩트가 없습니다.");
    return;
  }
  var zip = new JSZip();
  // 이슈별 폴더로 구성
  var usedNames = {};
  artifacts.forEach(function(a) {
    var folder = a.issueIdentifier ? a.issueIdentifier + "_" + (a.issueTitle || "").substring(0, 30).replace(/[<>:"/\\|?*]/g, "_") : "misc";
    var filename = a.title || ("artifact_" + a.id);
    var path = folder + "/" + filename;
    // 중복 방지
    if (usedNames[path]) {
      var parts = filename.split(".");
      var ext = parts.length > 1 ? "." + parts.pop() : "";
      var base = parts.join(".");
      var n = 2;
      while (usedNames[folder + "/" + base + "_" + n + ext]) n++;
      path = folder + "/" + base + "_" + n + ext;
    }
    usedNames[path] = true;
    zip.file(path, a.content);
  });
  // README 추가
  var readme = "# JWAY Paperclip 아티팩트 Export\n\n";
  readme += "- 내보내기 시간: " + new Date().toLocaleString("ko-KR") + "\n";
  readme += "- 파일 수: " + artifacts.length + "\n";
  readme += "- 총 크기: " + (artifacts.reduce(function(s,a){return s+a.content.length},0) / 1024).toFixed(1) + " KB\n\n";
  readme += "## 파일 목록\n\n";
  artifacts.forEach(function(a) {
    readme += "- `" + (a.issueIdentifier || "") + "/" + a.title + "` - " + (a.description || "") + " (by " + a.agentName + ")\n";
  });
  zip.file("README.md", readme);

  var blob = await zip.generateAsync({ type: "blob" });
  var url = URL.createObjectURL(blob);
  var el = document.createElement("a");
  el.href = url;
  el.download = zipName || "jway-paperclip-artifacts.zip";
  document.body.appendChild(el);
  el.click();
  document.body.removeChild(el);
  URL.revokeObjectURL(url);
}
// 간단한 마크다운 렌더러 (미리보기용, 완벽하지 않음)
function renderMarkdownLite(md) {
  var esc = function(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  var html = esc(md);
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, "<pre><code>$2</code></pre>");
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/^- (.+)$/gm, "<li>$1</li>");
  html = html.replace(/(<li>.*<\/li>\n?)+/g, function(m) { return "<ul>" + m + "</ul>"; });
  html = html.replace(/\n\n/g, "</p><p>");
  html = "<p>" + html + "</p>";
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Preview</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.6;color:#1f2937}h1{border-bottom:2px solid #6366f1;padding-bottom:8px}h2{color:#6366f1;margin-top:32px}h3{color:#4f46e5}code{background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:0.9em}pre{background:#1f2937;color:#f3f4f6;padding:16px;border-radius:8px;overflow-x:auto}pre code{background:transparent;color:inherit;padding:0}ul{padding-left:20px}a{color:#6366f1}</style></head><body>' + html + '</body></html>';
}

function downloadMarkdown(content, filename) {
  var blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename || "jway-paperclip-report.md";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      <div className="card" style={{padding:14,display:"flex",flexDirection:"column",gap:10}}>
        <input className="input" placeholder="🔍 제목, 설명, 내용, 이슈에서 검색..." value={searchQuery} onChange={function(e){setSearchQuery(e.target.value)}} style={{fontSize:14}}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <span className="text-sm text-muted">타입:</span>
          <button className="btn" style={{padding:"4px 10px",fontSize:11,background:typeFilter===""?"var(--accent)":"",color:typeFilter===""?"white":""}} onClick={function(){setTypeFilter("")}}>전체</button>
          {Object.keys(typeCounts).sort().map(function(t) {
            return <button key={t} className="btn" style={{padding:"4px 10px",fontSize:11,background:typeFilter===t?"var(--accent)":"",color:typeFilter===t?"white":""}} onClick={function(){setTypeFilter(typeFilter===t?"":t)}}>{artifactEmoji(t) + " " + t + " (" + typeCounts[t] + ")"}</button>;
          })}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <span className="text-sm text-muted">작성자:</span>
          <button className="btn" style={{padding:"4px 10px",fontSize:11,background:agentFilter===""?"var(--accent)":"",color:agentFilter===""?"white":""}} onClick={function(){setAgentFilter("")}}>전체</button>
          {Object.keys(agentCounts).map(function(aid) {
            var a = data.agents.find(function(x){return x.id===aid});
            if (!a) return null;
            return <button key={aid} className="btn" style={{padding:"4px 10px",fontSize:11,background:agentFilter===aid?"var(--accent)":"",color:agentFilter===aid?"white":""}} onClick={function(){setAgentFilter(agentFilter===aid?"":aid)}}>{a.icon + " " + a.name + " (" + agentCounts[aid] + ")"}</button>;
          })}
        </div>
        <div className="text-sm text-muted" style={{marginTop:4}}>{"결과: " + filtered.length + " / " + allArtifacts.length + "개"}</div>
      </div>

      {/* 아티팩트 목록 */}
      {filtered.length === 0 ? (
        <div className="card" style={{padding:40,textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:8}}>📎</div>
          <div className="text-sm text-muted">{allArtifacts.length === 0 ? "아직 아티팩트가 없습니다. 협업 Heartbeat에서 에이전트에게 artifact 생성을 요청해보세요!" : "검색 결과가 없습니다"}</div>
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:12}}>
          {filtered.map(function(a) {
            var agent = data.agents.find(function(ag){return ag.id===a.agentId});
            var issue = data.issues.find(function(i){return i.id===a.issueId});
            var versionInfo = getArtifactVersions(issue, a);
            return (
              <div key={a.id} className="card" style={{padding:14,display:"flex",flexDirection:"column",gap:8,borderLeft:"3px solid var(--success)"}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:18}}>{artifactEmoji(a.type)}</span>
                  <span className="font-medium text-sm" style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={a.title}>{a.title}</span>
                  {versionInfo.total > 1 && <span className="badge" style={{fontSize:9,background:"var(--warning-light)",color:"var(--warning)"}}>{"v"+versionInfo.version+"/"+versionInfo.total}</span>}
                  <span className="badge" style={{fontSize:9,background:"var(--bg-secondary)"}}>{a.type}</span>
                </div>
                {a.description && <div className="text-sm text-muted" style={{fontSize:12}}>{a.description}</div>}
                <div className="text-sm" style={{fontSize:11,color:"var(--text-tertiary)"}}>
                  <div>{"📋 " + a.issueIdentifier + " — " + a.issueTitle.substring(0, 30) + (a.issueTitle.length>30?"...":"")}</div>
                  <div>{"👤 " + (agent ? (agent.icon + " " + agent.name) : a.agentName) + " · " + new Date(a.createdAt).toLocaleString("ko-KR")}</div>
                  <div>{"📏 " + a.content.length.toLocaleString() + "자"}</div>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button className="btn btn-primary" style={{padding:"4px 10px",fontSize:11}} onClick={function(){downloadArtifact(a)}}>⬇ 다운로드</button>
                  {a.type === "html" && <button className="btn" style={{padding:"4px 10px",fontSize:11}} onClick={function(){previewHtmlArtifact(a)}}>🔍 HTML</button>}
                  {a.type === "markdown" && <button className="btn" style={{padding:"4px 10px",fontSize:11}} onClick={function(){previewHtmlArtifact(a)}}>📖 렌더</button>}
                  <button className="btn" style={{padding:"4px 10px",fontSize:11}} onClick={function(){setSelectedArtifact(a)}}>👁 상세</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* 상세 모달 */}
      {selectedArtifact && (function() {
        var issue = data.issues.find(function(i){return i.id===selectedArtifact.issueId});
        var versionInfo = getArtifactVersions(issue, selectedArtifact);
        return (
        <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)setSelectedArtifact(null)}}>
          <div className="modal" style={{maxWidth:900}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:22}}>{artifactEmoji(selectedArtifact.type)}</span>
                  <h3 style={{margin:0,fontSize:18}}>{selectedArtifact.title}</h3>
                  {versionInfo.total > 1 && <span className="badge" style={{background:"var(--warning-light)",color:"var(--warning)"}}>{"버전 " + versionInfo.version + " / " + versionInfo.total}</span>}
                </div>
                <div className="text-sm text-muted" style={{marginTop:4}}>{selectedArtifact.issueIdentifier + " · " + selectedArtifact.agentName + " · " + new Date(selectedArtifact.createdAt).toLocaleString("ko-KR")}</div>
              </div>
              <button className="btn" style={{padding:"4px 8px",fontSize:12}} onClick={function(){setSelectedArtifact(null)}}>✕</button>
            </div>
            {selectedArtifact.description && <div className="text-sm" style={{marginBottom:12,padding:10,background:"var(--bg-secondary)",borderRadius:6}}>{selectedArtifact.description}</div>}

            {/* 버전 히스토리 */}
            {versionInfo.total > 1 && (
              <div style={{marginBottom:12,padding:10,background:"#fff8e1",borderRadius:6,border:"1px solid var(--warning-light)"}}>
                <div className="text-sm font-medium" style={{marginBottom:6}}>{"📚 이 파일의 버전 " + versionInfo.total + "개"}</div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {versionInfo.all.map(function(v, idx) {
                    var isCurrent = v.id === selectedArtifact.id;
                    var prevV = idx > 0 ? versionInfo.all[idx-1] : null;
                    var delta = prevV ? (v.content.length - prevV.content.length) : 0;
                    return (
                      <div key={v.id} style={{padding:"6px 10px",background:isCurrent?"var(--accent-light)":"var(--bg-secondary)",borderRadius:4,cursor:isCurrent?"default":"pointer",display:"flex",alignItems:"center",gap:8,fontSize:11}} onClick={function(){if(!isCurrent)setSelectedArtifact({...v, issueId:selectedArtifact.issueId, issueIdentifier:selectedArtifact.issueIdentifier, issueTitle:selectedArtifact.issueTitle})}}>
                        <span className="badge" style={{fontSize:9,background:isCurrent?"var(--accent)":"var(--bg-tertiary)",color:isCurrent?"white":"inherit"}}>{"v" + (idx+1)}</span>
                        <span style={{flex:1}}>{v.agentName + " · " + new Date(v.createdAt).toLocaleString("ko-KR")}</span>
                        <span style={{color:"var(--text-tertiary)"}}>{v.content.length.toLocaleString() + "자"}</span>
                        {prevV && <span style={{color:delta>0?"var(--success)":delta<0?"var(--danger)":"var(--text-tertiary)",fontWeight:600}}>{(delta>0?"+":"") + delta}</span>}
                        {isCurrent && <span className="badge" style={{fontSize:8,background:"var(--accent)",color:"white"}}>현재</span>}
                      </div>
                    );
                  })}
                </div>
                <div className="text-sm text-muted" style={{marginTop:6,fontSize:10}}>다른 버전 클릭 시 전환됩니다 · + / - 는 이전 버전 대비 글자 수 차이</div>
              </div>
            )}

            <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
              <button className="btn btn-primary" style={{fontSize:12}} onClick={function(){downloadArtifact(selectedArtifact)}}>⬇ 다운로드</button>
              {selectedArtifact.type === "html" && <button className="btn" style={{fontSize:12}} onClick={function(){previewHtmlArtifact(selectedArtifact)}}>🔍 HTML 미리보기</button>}
              {selectedArtifact.type === "markdown" && <button className="btn" style={{fontSize:12}} onClick={function(){previewHtmlArtifact(selectedArtifact)}}>📖 렌더링 보기</button>}
            </div>
            <pre style={{maxHeight:500,overflow:"auto",background:"var(--bg-primary)",padding:12,borderRadius:6,fontSize:11,whiteSpace:"pre-wrap",wordBreak:"break-all",border:"1px solid var(--border)"}}>{selectedArtifact.content}</pre>
          </div>
        </div>
        );
      })()}
    </div>
  );
}

  const [desc, setDesc] = useState(co ? co.description : "");
  const [brandColor, setBrandColor] = useState(co ? co.brandColor : "#6366f1");
  const [globalPrompt, setGlobalPrompt] = useState(data.settings.globalPrompt || "");
  const [saved, setSaved] = useState(false);

  const saveSettings = () => {
    var updatedSettings = { ...data.settings, apiKey: apiKey.trim(), companyName: companyName, globalPrompt: globalPrompt };

      return c.id === co.id ? { ...c, name: companyName, description: desc, budgetMonthlyCents: parseInt(budget) || 10000, brandColor: brandColor } : c;

    onUpdate({ ...data, agents: resetAgents, companies: resetCompanies, activityLog: [...data.activityLog, { id: uid(), emoji: "🔄", message: "월간 비용이 초기화됨", createdAt: now() }] });
  };

  const exportData = () => {

// ========== Projects Page ==========
function ProjectsPage({ data, onUpdate }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { name: "", description: "", status: "active" };
  const [f, setF] = useState({ ...blank });

  const create = () => {
    if (!f.name.trim()) return;
    var co = data.companies[0];
    var project = { id: uid(), companyId: co ? co.id : "", name: f.name, description: f.description, status: f.status, createdAt: now(), updatedAt: now() };
    onUpdate({ ...data, projects: [...data.projects, project], activityLog: [...data.activityLog, { id: uid(), emoji: "📁", message: "프로젝트 \"" + f.name + "\" 생성됨", createdAt: now() }] });
    setF({ ...blank }); setShowForm(false);
  };

  const del = (id) => {
    var p = data.projects.find(function(x) { return x.id === id; });
    var updatedIssues = data.issues.map(function(i) { return i.projectId === id ? { ...i, projectId: null } : i; });
    onUpdate({ ...data, projects: data.projects.filter(function(x) { return x.id !== id; }), issues: updatedIssues, activityLog: [...data.activityLog, { id: uid(), emoji: "🗑️", message: "프로젝트 \"" + (p ? p.name : "") + "\" 삭제됨", createdAt: now() }] });
  };

  const toggleStatus = (id) => {
    onUpdate({ ...data, projects: data.projects.map(function(p) { return p.id === id ? { ...p, status: p.status === "active" ? "archived" : "active", updatedAt: now() } : p; }) });
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div className="font-bold" style={{fontSize:18}}>📁 프로젝트 ({data.projects.length})</div>
        <button className="btn btn-primary" onClick={function(){setShowForm(!showForm)}}>{showForm ? "취소" : "+ 프로젝트 생성"}</button>
      </div>

      {showForm && (
        <div className="card" style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="input" placeholder="프로젝트 이름 *" value={f.name} onChange={function(e){setF({...f,name:e.target.value})}}/>
          <textarea className="input" placeholder="설명 (선택)" value={f.description} onChange={function(e){setF({...f,description:e.target.value})}} rows={2} style={{resize:"vertical"}}/>
          <button className="btn btn-primary" onClick={create}>프로젝트 생성</button>
        </div>
      )}

      {data.projects.length === 0
        ? <div className="card" style={{textAlign:"center",padding:40}}><div className="text-sm text-muted">첫 번째 프로젝트를 만들어보세요!</div></div>
        : data.projects.map(function(p) {
          var projectIssues = data.issues.filter(function(i) { return i.projectId === p.id; });
          var doneCount = projectIssues.filter(function(i) { return i.status === "done"; }).length;
          var progressPct = projectIssues.length > 0 ? Math.round(doneCount / projectIssues.length * 100) : 0;
          return (
            <div key={p.id} className="card">
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
                <span style={{fontSize:24}}>📁</span>
                <div style={{flex:1}}>
                  <div className="font-medium" style={{fontSize:16}}>{p.name}</div>
                  {p.description && <div className="text-sm text-muted">{p.description}</div>}
                </div>
                <span className={"badge " + (p.status === "active" ? "badge-working" : "badge-idle")}>{p.status === "active" ? "활성" : "보관됨"}</span>
                <button className="btn" style={{padding:"4px 8px",fontSize:12}} onClick={function(){toggleStatus(p.id)}}>{p.status === "active" ? "보관" : "활성화"}</button>
                <button className="btn" style={{padding:"4px 8px",fontSize:12,color:"var(--danger)"}} onClick={function(){del(p.id)}}>삭제</button>
              </div>
              <div style={{display:"flex",gap:16,alignItems:"center"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span className="text-sm text-muted">{"이슈 " + projectIssues.length + "건"}</span>
                    <span className="text-sm text-muted">{doneCount + "/" + projectIssues.length + " 완료 (" + progressPct + "%)"}</span>
                  </div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{width:progressPct+"%",background:"var(--success)"}}/>
                  </div>
                </div>
              </div>
              {projectIssues.length > 0 && (
                <div style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}}>
                  {projectIssues.slice(0, 5).map(function(i) {
                    return <span key={i.id} className={"badge badge-" + (i.status === "done" ? "done" : i.status === "in_progress" ? "working" : "idle")} style={{fontSize:11}}>{i.identifier + " " + i.title.substring(0, 20)}</span>;
                  })}
                  {projectIssues.length > 5 && <span className="text-sm text-muted">{"+" + (projectIssues.length - 5) + "건"}</span>}
                </div>
              )}
            </div>
          );
        })
      }
    </div>
  );
}

// ========== Goals Page ==========
function GoalsPage({ data, onUpdate }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { title: "", description: "", level: "company", assigneeAgentId: "", targetDate: "", status: "active" };
  const [f, setF] = useState({ ...blank });

  const create = () => {
    if (!f.title.trim()) return;
    var co = data.companies[0];
    var goal = { id: uid(), companyId: co ? co.id : "", title: f.title, description: f.description, level: f.level, assigneeAgentId: f.assigneeAgentId || null, targetDate: f.targetDate || null, status: f.status, progress: 0, createdAt: now(), updatedAt: now() };
    onUpdate({ ...data, goals: [...data.goals, goal], activityLog: [...data.activityLog, { id: uid(), emoji: "🎯", message: "목표 \"" + f.title + "\" 생성됨 (" + f.level + ")", createdAt: now() }] });
    setF({ ...blank }); setShowForm(false);
  };

  const del = (id) => {
    var g = data.goals.find(function(x) { return x.id === id; });
    onUpdate({ ...data, goals: data.goals.filter(function(x) { return x.id !== id; }), activityLog: [...data.activityLog, { id: uid(), emoji: "🗑️", message: "목표 \"" + (g ? g.title : "") + "\" 삭제됨", createdAt: now() }] });
  };

  const updateProgress = (id, progress) => {
    var newStatus = progress >= 100 ? "completed" : "active";
    onUpdate({ ...data, goals: data.goals.map(function(g) { return g.id === id ? { ...g, progress: Math.min(100, Math.max(0, parseInt(progress) || 0)), status: newStatus, updatedAt: now() } : g; }) });
  };

  var levelLabels = { company: "🏢 회사", team: "👥 팀", agent: "🤖 에이전트" };
  var companyGoals = data.goals.filter(function(g) { return g.level === "company"; });
  var teamGoals = data.goals.filter(function(g) { return g.level === "team"; });
  var agentGoals = data.goals.filter(function(g) { return g.level === "agent"; });

  var renderGoal = function(g) {
    var agent = g.assigneeAgentId ? data.agents.find(function(a) { return a.id === g.assigneeAgentId; }) : null;
    var isCompleted = g.status === "completed" || g.progress >= 100;
    return (
      <div key={g.id} className="card" style={{padding:16,marginBottom:8,opacity:isCompleted?0.7:1}}>

          <button className="btn btn-primary" onClick={create}>목표 추가</button>
        </div>
      )}

      {data.goals.length === 0
        ? <div className="card" style={{textAlign:"center",padding:40}}><div className="text-sm text-muted">회사 → 팀 → 에이전트 순으로 목표를 설정해보세요!</div></div>

          <div style={{display:"flex",flexDirection:"column",gap:20}}>
            {companyGoals.length > 0 && (
              <div>
                <div className="text-sm font-medium" style={{marginBottom:8,color:"var(--text-secondary)"}}>🏢 회사 목표 ({companyGoals.length})</div>

              </div>
            )}

              <div>
                <div className="text-sm font-medium" style={{marginBottom:8,color:"var(--text-secondary)"}}>🤖 에이전트 목표 ({agentGoals.length})</div>
                {agentGoals.map(renderGoal)}
              </div>
            )}
          </div>
        )
      }
    </div>
  );
}

// ========== Approvals Page ==========
function ApprovalsPage({ data, onUpdate }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { title: "", description: "", type: "action", requesterId: "" };
  const [f, setF] = useState({ ...blank });

  const create = () => {
    if (!f.title.trim()) return;
    var approval = { id: uid(), title: f.title, description: f.description, type: f.type, requesterId: f.requesterId || null, status: "pending", createdAt: now(), updatedAt: now(), resolvedAt: null, resolvedBy: "human" };
    onUpdate({ ...data, approvals: [...data.approvals, approval], activityLog: [...data.activityLog, { id: uid(), emoji: "🛡️", message: "승인 요청: \"" + f.title + "\"", createdAt: now() }] });
    setF({ ...blank }); setShowForm(false);
  };

  const resolve = (id, status) => {
    var ap = data.approvals.find(function(a) { return a.id === id; });
    onUpdate({ ...data,
      approvals: data.approvals.map(function(a) { return a.id === id ? { ...a, status: status, resolvedAt: now(), updatedAt: now() } : a; }),
      activityLog: [...data.activityLog, { id: uid(), emoji: status === "approved" ? "✅" : "❌", message: "\"" + (ap ? ap.title : "") + "\" " + (status === "approved" ? "승인됨" : "거부됨"), createdAt: now() }],
    });
  };

  const del = (id) => {
    onUpdate({ ...data, approvals: data.approvals.filter(function(a) { return a.id !== id; }) });
  };

  var pending = data.approvals.filter(function(a) { return a.status === "pending"; });
  var resolved = data.approvals.filter(function(a) { return a.status !== "pending"; }).slice(-20).reverse();

  var typeLabels = { action: "⚡ 액션", budget: "💰 예산", hire: "👤 채용", deploy: "🚀 배포", other: "📋 기타" };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div className="font-bold" style={{fontSize:18}}>{"🛡️ 승인 대기열 (" + pending.length + "건 대기)"}</div>
        <button className="btn btn-primary" onClick={function(){setShowForm(!showForm)}}>{showForm ? "취소" : "+ 승인 요청"}</button>
      </div>

      {showForm && (
        <div className="card" style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="input" placeholder="승인 요청 제목 *" value={f.title} onChange={function(e){setF({...f,title:e.target.value})}}/>
          <textarea className="input" placeholder="설명 (선택)" value={f.description} onChange={function(e){setF({...f,description:e.target.value})}} rows={2} style={{resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}>
            <select className="input" value={f.type} onChange={function(e){setF({...f,type:e.target.value})}} style={{flex:1}}>
              <option value="action">⚡ 액션</option>
              <option value="budget">💰 예산</option>
              <option value="hire">👤 채용</option>
              <option value="deploy">🚀 배포</option>
              <option value="other">📋 기타</option>
            </select>
            <select className="input" value={f.requesterId} onChange={function(e){setF({...f,requesterId:e.target.value})}} style={{flex:1}}>
              <option value="">요청자 (선택)</option>
              {data.agents.map(function(a){return <option key={a.id} value={a.id}>{a.icon + " " + a.name}</option>})}
            </select>
          </div>
          <button className="btn btn-primary" onClick={create}>승인 요청 생성</button>
        </div>
      )}

      {/* Pending */}
      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>{"⏳ 대기 중 (" + pending.length + ")"}</div>
        {pending.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>대기 중인 승인 요청이 없습니다</div>
          : pending.map(function(ap) {
            var requester = ap.requesterId ? data.agents.find(function(a) { return a.id === ap.requesterId; }) : null;
            return (
              <div key={ap.id} className="table-row" style={{flexWrap:"wrap",gap:8}}>
                <span className="badge badge-paused" style={{fontSize:11}}>{typeLabels[ap.type] || ap.type}</span>
                <div style={{flex:"1 1 200px",minWidth:0}}>
                  <div className="text-sm font-medium">{ap.title}</div>
                  {ap.description && <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{ap.description}</div>}
                </div>
                {requester && <span className="text-sm text-muted">{requester.icon + " " + requester.name}</span>}
                <span className="text-sm text-muted">{new Date(ap.createdAt).toLocaleString("ko-KR")}</span>
                <div style={{display:"flex",gap:4}}>
                  <button className="btn" style={{padding:"4px 12px",fontSize:12,background:"var(--success-light)",color:"var(--success)",borderColor:"var(--success)"}} onClick={function(){resolve(ap.id,"approved")}}>✅ 승인</button>
                  <button className="btn" style={{padding:"4px 12px",fontSize:12,background:"var(--danger-light)",color:"var(--danger)",borderColor:"var(--danger)"}} onClick={function(){resolve(ap.id,"rejected")}}>❌ 거부</button>
                </div>
              </div>
            );
          })
        }
      </div>

      {/* Resolved */}
      {resolved.length > 0 && (
        <div className="card">
          <div className="font-medium" style={{marginBottom:12}}>{"📋 처리 완료 (최근 " + resolved.length + "건)"}</div>
          {resolved.map(function(ap) {
            var requester = ap.requesterId ? data.agents.find(function(a) { return a.id === ap.requesterId; }) : null;
            return (
              <div key={ap.id} className="table-row" style={{opacity:0.7}}>
                <span className={"badge " + (ap.status === "approved" ? "badge-done" : "badge-error")} style={{fontSize:11}}>{ap.status === "approved" ? "승인됨" : "거부됨"}</span>
                <span className="badge badge-idle" style={{fontSize:11}}>{typeLabels[ap.type] || ap.type}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div className="text-sm">{ap.title}</div>
                </div>
                {requester && <span className="text-sm text-muted">{requester.icon}</span>}
                <span className="text-sm text-muted">{ap.resolvedAt ? new Date(ap.resolvedAt).toLocaleString("ko-KR") : ""}</span>
                <button className="btn" style={{padding:"2px 6px",fontSize:11}} onClick={function(){del(ap.id)}}>삭제</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

          </div>
          {step === 1 && (
            <div style={{marginTop:12,textAlign:"center"}}>
              <button className="btn" style={{padding:"6px 12px",fontSize:11,color:"#9ca3af",background:"transparent",border:"none"}} onClick={onClose}>건너뛰기</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(function(){
    if (DEMO_MODE) {
      // 데모 모드: 매번 새 데모 데이터 로드 (localStorage 덮어쓰지 않음)
      var demo = buildDemoData();
      save(demo);
      return demo;
    }
    return load() || init();
  });
  const [page, setPage] = useState("dashboard");
  const [authed, setAuthed] = useState(function(){ return DEMO_MODE || sessionStorage.getItem(AUTH_KEY) === "1"; });
  const [menuOpen, setMenuOpen] = useState(false);
  const [demoWelcomeOpen, setDemoWelcomeOpen] = useState(function(){ return DEMO_MODE; });
  const [demoCompleteOpen, setDemoCompleteOpen] = useState(false);

  useEffect(function() {
    if (DEMO_MODE) {
      window.__showDemoCompleteModal = function() { setDemoCompleteOpen(true); };
      return function() { window.__showDemoCompleteModal = null; };
    }
  }, []);

  useEffect(()=>{save(data);},[data]);

  if (DEMO_MODE) {
    // 데모 모드는 Lock Screen과 Setup Screen을 건너뛴다
  } else {
    if(localStorage.getItem(LOCK_KEY) && !authed) return <LockScreen onUnlock={()=>setAuthed(true)}/>;
    if(!localStorage.getItem(LOCK_KEY) && !authed) return <LockScreen onUnlock={()=>setAuthed(true)}/>;

    if(!data.settings.apiKey) return <SetupScreen data={data} onUpdate={setData}/>;
  }

  const co = data.companies[0];
  const pages = {
    dashboard: <DashboardPage data={data} onUpdate={setData}/>,
    agents: <AgentsPage data={data} onUpdate={setData}/>,
    office: <OfficePage data={data}/>,
    orgchart: <OrgChartPage data={data}/>,
    issues: <IssuesPage data={data} onUpdate={setData}/>,
    projects: <ProjectsPage data={data} onUpdate={setData}/>,
    goals: <GoalsPage data={data} onUpdate={setData}/>,
    approvals: <ApprovalsPage data={data} onUpdate={setData}/>,
    costs: <CostsPage data={data}/>,
    conversations: <ConversationsPage data={data}/>,
    artifacts: <ArtifactsPage data={data}/>,
    brain: <BrainGraphPage data={data} onUpdate={setData}/>,
    routines: <HeartbeatPage data={data} onUpdate={setData}/>,
    activity: <ActivityPage data={data}/>,
    help: <HelpPage data={data} onNav={setPage}/>,
    settings: <SettingsPage data={data} onUpdate={setData}/>,
  };

  return (
    <React.Fragment>
      {DEMO_MODE && (
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:9999,background:"linear-gradient(90deg,#f59e0b,#ef4444)",color:"white",padding:"8px 16px",display:"flex",alignItems:"center",justifyContent:"center",gap:12,fontSize:13,fontWeight:600,boxShadow:"0 2px 8px rgba(0,0,0,0.15)",flexWrap:"wrap"}}>
          <span>🎬 <strong>데모 모드</strong> — 시뮬레이션, 실제 AI 응답 아님</span>
          <button onClick={function(){setDemoWelcomeOpen(true)}} style={{background:"rgba(255,255,255,0.25)",color:"white",border:"1px solid rgba(255,255,255,0.4)",borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:600,cursor:"pointer"}}>❓ 사용법</button>
          <a href="./" style={{background:"white",color:"#ef4444",textDecoration:"none",fontWeight:700,padding:"3px 10px",borderRadius:6,fontSize:12}}>🚀 정식 시작</a>
        </div>
      )}
      {DEMO_MODE && demoWelcomeOpen && <DemoWelcomeModal onClose={function(){setDemoWelcomeOpen(false)}} onStart={function(){setPage("routines")}}/>}
      {DEMO_MODE && demoCompleteOpen && <DemoCompleteModal onClose={function(){setDemoCompleteOpen(false)}} onGoOffice={function(){setDemoCompleteOpen(false);setPage("office")}} onGoBrain={function(){setDemoCompleteOpen(false);setPage("brain")}}/>}
      <div className="app" style={DEMO_MODE ? {marginTop:44} : {}}>
        <SidebarNav data={data} activePage={page} onNav={setPage} mobileOpen={menuOpen} onClose={()=>setMenuOpen(false)}/>
        <div className="main">
          <div className="header">
            <button className="mobile-menu-btn" onClick={()=>setMenuOpen(true)}>☰</button>
            <div className="font-medium">{co?co.name:"JWAY Digital"}{DEMO_MODE ? " (데모)" : ""}</div>
            <div style={{flex:1}}/>
            <div className="text-sm text-muted">{DEMO_MODE ? "Demo Mode" : "Board: JaeWoo"}</div>
          </div>
          <div className="content">{pages[page]||pages.dashboard}</div>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
