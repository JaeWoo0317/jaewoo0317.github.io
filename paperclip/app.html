  <style>
    :root {
      --bg-primary:#ffffff;--bg-secondary:#f8f9fa;--bg-tertiary:#f1f3f5;
      --text-primary:#1a1a2e;--text-secondary:#6b7280;--text-tertiary:#9ca3af;
      --border:#e5e7eb;--accent:#6366f1;--accent-light:#eef2ff;
      --success:#10b981;--success-light:#ecfdf5;--warning:#f59e0b;--warning-light:#fffbeb;
      --danger:#ef4444;--danger-light:#fef2f2;--info:#3b82f6;--info-light:#eff6ff;
      --sidebar-width:240px;--header-height:56px;--radius:8px;--radius-lg:12px;--transition:150ms ease;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg-primary:#0f0f1a;--bg-secondary:#1a1a2e;--bg-tertiary:#16213e;
      --text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-tertiary:#64748b;
      --border:#2d3748;--accent-light:#1e1b4b;--success-light:#064e3b;
      --warning-light:#451a03;--danger-light:#450a0a;--info-light:#1e3a5f;
    }}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-tertiary);color:var(--text-primary);line-height:1.5}
    .app{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:var(--sidebar-width);background:var(--bg-primary);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .header{height:var(--header-height);background:var(--bg-primary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
    .content{flex:1;overflow-y:auto;padding:24px}
    .sidebar-brand{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px}
    .sidebar-section{padding:12px 8px 4px}
    .sidebar-section-title{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-tertiary);padding:0 8px 4px;letter-spacing:.05em}
    .sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text-secondary);transition:all var(--transition)}
    .sidebar-item:hover{background:var(--bg-secondary);color:var(--text-primary)}
    .sidebar-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
    .sidebar-icon{font-size:16px;width:20px;text-align:center}
    .sidebar-badge{margin-left:auto;background:var(--danger);color:white;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:600}
    .card{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .metric-card{display:flex;flex-direction:column;gap:4px}
    .metric-label{font-size:13px;color:var(--text-secondary)}
    .metric-value{font-size:28px;font-weight:700}
    .metric-sub{font-size:12px;color:var(--text-tertiary)}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500}
    .badge-idle{background:var(--bg-secondary);color:var(--text-secondary)}
    .badge-working{background:var(--info-light);color:var(--info)}
    .badge-paused{background:var(--warning-light);color:var(--warning)}
    .badge-error{background:var(--danger-light);color:var(--danger)}
    .badge-done{background:var(--success-light);color:var(--success)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);font-size:14px;cursor:pointer;transition:all var(--transition)}
    .btn:hover{background:var(--bg-secondary)}
    .btn-primary{background:var(--accent);color:white;border-color:var(--accent)}
    .btn-primary:hover{opacity:.9}
    .table-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background var(--transition)}
    .table-row:hover{background:var(--bg-secondary)}
    .table-row:last-child{border-bottom:none}
    .input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:var(--bg-primary);color:var(--text-primary);outline:none}
    .input:focus{border-color:var(--accent)}
    .setup-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg-tertiary)}
    .setup-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:40px;max-width:480px;width:100%;border:1px solid var(--border);text-align:center}
    .text-sm{font-size:13px}.text-muted{color:var(--text-secondary)}.font-medium{font-weight:500}.font-bold{font-weight:700}
    #loading{display:flex;align-items:center;justify-content:center;height:100vh;color:#6b7280;font-family:sans-serif;font-size:16px}

      .sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:999}
      .sidebar-overlay.open{display:block}
      .mobile-menu-btn{display:block}

      .content{padding:12px}
      .card{padding:14px}
      .card-grid{grid-template-columns:1fr 1fr;gap:10px}
      .metric-value{font-size:20px}
      .metric-label{font-size:12px}
      .kanban{flex-direction:column;gap:8px}
      .kanban-col{min-width:100%;width:100%;max-height:none}
      .kanban-col-body{max-height:300px}
      .table-row{flex-direction:column;gap:4px;padding:10px 12px}
      .btn{padding:8px 12px;font-size:13px}
      .input{padding:8px 12px;font-size:14px}
      .modal{width:95%;max-width:none;padding:16px;margin:8px}
      .setup-card{padding:24px;margin:16px}
      .run-card-header{flex-wrap:wrap}
      .daily-chart{height:80px}

    }
    @media(max-width:480px){
      .card-grid{grid-template-columns:1fr}
      .metric-value{font-size:18px}

      .modal h2,.modal h3{font-size:18px}

      /* 탭/버튼 그룹 */
      div[style*="borderBottom:\"2px solid"]>button{padding:8px 10px !important;font-size:12px !important}

    /* Very small screens (iPhone SE 등) */
    @media(max-width:360px){
      .hero h1{font-size:26px}
      .section-title{font-size:22px}
      .metric-value{font-size:16px}
      .content{padding:6px}
      .card{padding:10px}
    }
    /* Kanban */
    .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;min-height:0;flex:1}
    .kanban-col{min-width:240px;width:240px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 160px)}
    .kanban-col-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:13px;font-weight:600;border-radius:var(--radius) var(--radius) 0 0;background:var(--bg-secondary);border:1px solid var(--border);border-bottom:none}
    .kanban-col-count{background:var(--bg-tertiary);color:var(--text-tertiary);font-size:11px;padding:1px 6px;border-radius:8px;font-weight:500}
    .kanban-col-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--bg-secondary);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
    .kanban-card{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:all var(--transition);position:relative}
    .kanban-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(99,102,241,0.1)}
    .kanban-card-id{font-size:11px;color:var(--text-tertiary);font-weight:500}
    .kanban-card-title{font-size:13px;font-weight:500;margin:4px 0}
    .kanban-card-footer{display:flex;align-items:center;gap:6px;margin-top:6px}
    .kanban-card-agent{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:3px}
    .priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .priority-low{background:#94a3b8}.priority-medium{background:#f59e0b}.priority-high{background:#ef4444}.priority-urgent{background:#dc2626;box-shadow:0 0 4px rgba(220,38,38,0.4)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
    .modal{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:90%;max-width:520px;max-height:80vh;overflow-y:auto}
    .modal h2{font-size:18px;margin-bottom:16px}
    .move-btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
    .move-btn{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg-secondary);cursor:pointer;color:var(--text-secondary);transition:all var(--transition)}
    .move-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
    .move-btn.current{background:var(--accent);color:white;border-color:var(--accent)}
    /* Heartbeat */
    .hb-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500}
    .hb-active{background:var(--success-light);color:var(--success)}
    .hb-stopped{background:var(--bg-secondary);color:var(--text-tertiary)}
    .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse-anim 1.5s infinite}
    @keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
    .run-log{max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:12px;white-space:pre-wrap;line-height:1.6}
    .run-card{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
    .run-card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .cost-pill{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--warning-light);color:var(--warning);font-weight:500}
    .token-pill{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--info-light);color:var(--info);font-weight:500}
    /* Cost Dashboard */
    .progress-bar{width:100%;height:8px;background:var(--bg-tertiary);border-radius:4px;overflow:hidden}
    .progress-fill{height:100%;border-radius:4px;transition:width .3s ease}
    .daily-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0}
    .daily-bar{flex:1;min-width:0;border-radius:3px 3px 0 0;background:var(--accent);transition:height .3s ease;position:relative;cursor:default}
    .daily-bar:hover{opacity:.8}
    .daily-label{font-size:10px;color:var(--text-tertiary);text-align:center;margin-top:4px}
    .model-bar{display:flex;height:24px;border-radius:4px;overflow:hidden;gap:1px}
    .model-segment{height:100%;transition:width .3s ease;min-width:2px}
  </style>
</head>
<body>
<div id="root"><div id="loading">📎 로딩 중...</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const STORAGE_KEY = "jway-paperclip";
const LOCK_KEY = "jway-paperclip-lock";
const AUTH_KEY = "jway-paperclip-auth";
const VER = "0.3.0";

async function hashPassword(pw) {
  var enc = new TextEncoder().encode(pw);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
}
const MODELS = {
  "claude-opus-4-6":           { name: "Opus 4.6",   inputPer1M: 500, outputPer1M: 2500 },
  "claude-sonnet-4-6":         { name: "Sonnet 4.6", inputPer1M: 300, outputPer1M: 1500 },
  "claude-haiku-4-5-20251001": { name: "Haiku 4.5",  inputPer1M: 100, outputPer1M: 500  },
};

function load() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function save(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function init() { return { version: VER, settings: { apiKey: "", companyName: "JWAY Digital" }, companies: [], agents: [], issues: [], projects: [], goals: [], costEvents: [], budgetPolicies: [], heartbeatRuns: [], routines: [], approvals: [], activityLog: [], plugins: [] }; }
function uid() { return crypto.randomUUID(); }
function now() { return new Date().toISOString(); }

// ========== Claude API Service ==========
async function callClaudeAPI(apiKey, model, systemPrompt, userMessage, maxTokens, tools) {
  maxTokens = maxTokens || 2048;
  // 💸 비용 절감: 시스템 프롬프트 캐싱 (500자 이상일 때만 유효, 90% 입력 토큰 할인)
  var systemContent;
  if (systemPrompt && systemPrompt.length > 500) {
    systemContent = [
      { type: "text", text: systemPrompt, cache_control: { type: "ephemeral" } }
    ];
  } else {
    systemContent = systemPrompt;
  }
  var body = {
    model: model,
    max_tokens: maxTokens,
    system: systemContent,
    messages: [{ role: "user", content: userMessage }],
  };
  if (tools && tools.length > 0) body.tools = tools;
  var hasAdvisor = tools && tools.some(function(t) { return t.type === "advisor_20260301"; });
  var headers = {
    "Content-Type": "application/json",
    "x-api-key": apiKey,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true",
  };
  if (hasAdvisor) headers["anthropic-beta"] = "advisor-tool-2026-03-01";
  // surrogate 문자 제거 (이모지 깨짐 방지)
  var bodyStr = JSON.stringify(body).replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, "");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: headers,
    body: bodyStr,
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error("API Error " + res.status + ": " + err);
  }
  return await res.json();
}

function buildAdvisorTool(advisorModel, maxUses) {
  return {
    type: "advisor_20260301",
    name: "advisor",
    model: advisorModel || "claude-opus-4-6",
    max_uses: maxUses || 3,
  };
}

// Advisor 호환 executor 모델 목록 (공식 문서 기준)
var ADVISOR_COMPATIBLE_EXECUTORS = ["claude-haiku-4-5-20251001", "claude-sonnet-4-6", "claude-opus-4-6"];

// 🎯 기본 모델 정책
var DEFAULT_MODEL = "claude-sonnet-4-6";       // 일반 에이전트
var DEFAULT_LEADER_MODEL = "claude-opus-4-6";   // 리더 에이전트
var LEADER_ROLES = ["ceo", "cto", "cmo", "coo", "pm"];  // 리더로 간주되는 역할
function isLeaderRole(role) { return LEADER_ROLES.indexOf((role || "").toLowerCase()) !== -1; }
function getDefaultModelForRole(role) { return isLeaderRole(role) ? DEFAULT_LEADER_MODEL : DEFAULT_MODEL; }

function calcCostCents(model, usage) {
  const p = MODELS[model];
  if (!p || !usage) return 0;
  const inp = ((usage.input_tokens || 0) / 1000000) * p.inputPer1M;
  const cached = ((usage.cache_read_input_tokens || 0) / 1000000) * p.inputPer1M * 0.1;
  const out = ((usage.output_tokens || 0) / 1000000) * p.outputPer1M;
  // Advisor 비용: usage.iterations[] 배열에서 advisor_message 타입 합산
  var advisorCost = 0;
  if (usage.iterations && Array.isArray(usage.iterations)) {
    usage.iterations.forEach(function(iter) {
      if (iter.type === "advisor_message" && iter.model) {
        var ap = MODELS[iter.model];
        if (ap) {
          advisorCost += ((iter.input_tokens || 0) / 1000000) * ap.inputPer1M
                       + ((iter.cache_read_input_tokens || 0) / 1000000) * ap.inputPer1M * 0.1
                       + ((iter.output_tokens || 0) / 1000000) * ap.outputPer1M;
        }
      }
    });
  }
  return Math.round((inp + cached + out + advisorCost) * 100) / 100;
}

// Advisor iterations에서 advisor 토큰만 추출
function extractAdvisorUsage(usage) {
  if (!usage || !usage.iterations) return null;
  var advisorIters = usage.iterations.filter(function(i) { return i.type === "advisor_message"; });
  if (advisorIters.length === 0) return null;
  var totalIn = 0, totalOut = 0;
  advisorIters.forEach(function(i) { totalIn += (i.input_tokens || 0); totalOut += (i.output_tokens || 0); });
  return { calls: advisorIters.length, inputTokens: totalIn, outputTokens: totalOut, model: advisorIters[0].model };
}

// ========== 목표/승인 연동 ==========
function recalcGoalProgress(data) {
  if (!data.goals || data.goals.length === 0) return data;
  var updatedGoals = data.goals.map(function(goal) {
    // goalId로 연결된 이슈 찾기
    var linkedIssues = data.issues.filter(function(i) { return i.goalId === goal.id; });
    // 담당 에이전트의 이슈도 포함 (goalId 없는 경우)
    if (linkedIssues.length === 0 && goal.assigneeAgentId) {
      linkedIssues = data.issues.filter(function(i) { return i.assigneeAgentId === goal.assigneeAgentId && i.status !== "cancelled"; });
    }
    if (linkedIssues.length === 0) return goal;
    var done = linkedIssues.filter(function(i) { return i.status === "done"; }).length;
    var progress = Math.round(done / linkedIssues.length * 100);
    var newStatus = progress >= 100 ? "completed" : "active";
    if (goal.progress === progress && goal.status === newStatus) return goal;
    return { ...goal, progress: progress, status: newStatus, updatedAt: now() };
  });
  return { ...data, goals: updatedGoals };
}

function createAutoApproval(data, type, title, description, requesterId) {
  var approval = {
    id: uid(), title: title, description: description, type: type,
    requesterId: requesterId || null, status: "pending",
    autoGenerated: true, createdAt: now(), updatedAt: now(),
    resolvedAt: null, resolvedBy: null,
  };
  var log = { id: uid(), emoji: "🛡️", message: "[자동] 승인 요청: " + title, createdAt: now() };
  return { ...data, approvals: [...data.approvals, approval], activityLog: [...data.activityLog, log] };
}

function hasPendingApproval(data, agentId) {
  return data.approvals.some(function(a) {
    return a.status === "pending" && a.requesterId === agentId;
  });
}

// ========== Heartbeat Engine ==========
// ========== 협업 헬퍼 ==========
function getExecutionOrder(agents) {
  var active = agents.filter(function(a) { return a.status !== "paused"; });
  var subordinateCount = {};
  active.forEach(function(a) { subordinateCount[a.id] = 0; });
  active.forEach(function(a) {
    if (a.reportsTo && subordinateCount[a.reportsTo] !== undefined) subordinateCount[a.reportsTo]++;
  });
  var managers = active.filter(function(a) { return subordinateCount[a.id] > 0; });
  var workers = active.filter(function(a) { return subordinateCount[a.id] === 0; });
  return { managers: managers, workers: workers };
}

function getTeamContext(agent, allAgents, activityLog) {
  var lines = [];
  var manager = agent.reportsTo ? allAgents.find(function(a) { return a.id === agent.reportsTo; }) : null;
  var subordinates = allAgents.filter(function(a) { return a.reportsTo === agent.id; });
  var peers = agent.reportsTo ? allAgents.filter(function(a) { return a.reportsTo === agent.reportsTo && a.id !== agent.id; }) : [];

  if (manager) lines.push("- " + manager.name + " (" + (manager.title || manager.role) + ", 매니저) — " + manager.status + " [ID:" + manager.id + "]");
  peers.forEach(function(p) { lines.push("- " + p.name + " (" + (p.title || p.role) + ", 동료) — " + p.status + " [ID:" + p.id + "]"); });
  subordinates.forEach(function(s) { lines.push("- " + s.name + " (" + (s.title || s.role) + ", 부하) — " + s.status + " [ID:" + s.id + "]"); });

  if (lines.length === 0) return "";
  return "## 팀 컨텍스트\n" + lines.join("\n") + "\n\n";
}

function formatIssueWithComments(issue) {
  var line = "- [" + issue.identifier + "] " + issue.title + " (상태: " + issue.status + ", 우선순위: " + issue.priority + ")\n";
  if (issue.description) line += "  설명: " + issue.description + "\n";
  var comments = issue.comments || [];
  if (comments.length > 0) {
    // 💸 비용 절감: 최근 3개만 + 80자로 축약 (과거 5개, 100자)
    comments.slice(-3).forEach(function(c) {
      line += "  [" + c.agentName + "] " + c.content.substring(0, 80) + "\n";
    });
  }
  return line;
}

function buildAgentPrompt(agent, issues, data) {
  var assignedIssues = issues.filter(function(i) {
    return i.assigneeAgentId === agent.id && i.status !== "done" && i.status !== "cancelled";
  });
  var company = data.companies[0];
  var prompt = "당신은 " + (company ? company.name : "JWAY Digital") + "의 " + agent.name + " (" + (agent.title || agent.role) + ") 입니다.\n\n";
  prompt += "## 역할 및 역량\n" + (agent.capabilities || "일반 업무") + "\n\n";

  // 팀 컨텍스트
  prompt += getTeamContext(agent, data.agents, data.activityLog);

  // 목표 컨텍스트
  var activeGoals = (data.goals || []).filter(function(g) { return g.status === "active"; });
  var myGoals = activeGoals.filter(function(g) { return g.assigneeAgentId === agent.id; });
  var companyGoals = activeGoals.filter(function(g) { return g.level === "company"; });
  var relevantGoals = myGoals.length > 0 ? myGoals : companyGoals;
  if (relevantGoals.length > 0) {
    prompt += "## 현재 목표\n";
    relevantGoals.forEach(function(g) {
      prompt += "- " + g.title + " (진행률: " + (g.progress || 0) + "%, 레벨: " + g.level + (g.targetDate ? ", 마감: " + g.targetDate : "") + ")\n";
      if (g.description) prompt += "  " + g.description + "\n";
    });
    prompt += "이슈 처리 시 위 목표 달성에 기여하도록 우선순위를 정하세요.\n\n";
  }

  // 할당된 이슈 (코멘트 포함)
  if (assignedIssues.length > 0) {
    prompt += "## 할당된 이슈 목록\n";
    assignedIssues.forEach(function(issue) { prompt += formatIssueWithComments(issue); });
  } else {
    prompt += "## 현재 할당된 이슈가 없습니다.\n";
  }

  // 팀원 이슈 (매니저인 경우 부하 이슈, 실무자인 경우 매니저 이슈)
  var subordinates = data.agents.filter(function(a) { return a.reportsTo === agent.id; });
  var teamIssueIds = {};
  assignedIssues.forEach(function(i) { teamIssueIds[i.id] = true; });
  var teamIssues = [];
  if (subordinates.length > 0) {
    teamIssues = issues.filter(function(i) {

    });
  } else if (agent.reportsTo) {
    var peers = data.agents.filter(function(a) { return a.reportsTo === agent.reportsTo && a.id !== agent.id; });
    teamIssues = issues.filter(function(i) {
      return !teamIssueIds[i.id] && i.status !== "done" && i.status !== "cancelled" && peers.some(function(p) { return p.id === i.assigneeAgentId; });
    }).slice(0, 5);

  if (teamIssues.length > 0) {

    teamIssues.forEach(function(issue) {
      var assignee = data.agents.find(function(a) { return a.id === issue.assigneeAgentId; });
      prompt += "- [" + issue.identifier + "] " + issue.title + " (담당: " + (assignee ? assignee.name : "?") + ", " + issue.status + ")\n";
      var comments = issue.comments || [];
      if (comments.length > 0) {
        comments.slice(-3).forEach(function(c) { prompt += "  [comment:" + c.agentName + "] " + c.content.substring(0, 80) + "\n"; });
      }
    });
  }

  // 지시사항
  prompt += "\n## 지시사항\n";
  prompt += "할당된 이슈를 검토하고, 각 이슈에 대해 다음 JSON 형식으로 응답해주세요:\n";
  prompt += '```json\n{\n  "actions": [\n    {\n      "issueId": "이슈ID",\n      "action": "start|complete|comment|reassign|artifact",\n      "comment": "작업 내용이나 결과 설명",\n      "targetAgentId": "재할당 대상 에이전트ID (reassign시에만)",\n      "artifactType": "html|css|js|json|markdown|code|text (artifact시에만)",\n      "artifactTitle": "파일명.확장자 (artifact시에만)",\n      "artifactContent": "파일 전체 내용 문자열 (artifact시에만)",\n      "artifactDescription": "짧은 설명 (artifact시 선택)"\n    }\n  ],\n  "summary": "전체 업무 요약"\n}\n```\n';
  prompt += "- action이 'start'면 이슈를 '진행 중'으로 변경\n";
  prompt += "- action이 'complete'면 이슈를 '완료'로 변경\n";
  prompt += "- action이 'comment'면 코멘트만 추가 (팀원과 소통용)\n";
  prompt += "- action이 'reassign'면 이슈를 다른 팀원에게 재할당 (targetAgentId 필수)\n";
  prompt += "- action이 'artifact'면 실제 결과물 파일을 생성 (랜딩페이지 HTML, 데이터 JSON, 문서 MD 등)\n";
  prompt += "- 팀원 이슈에 코멘트를 남기거나 재할당할 수 있습니다\n";
  prompt += "- 할당된 이슈가 없으면 summary만 작성\n";

  // 산출물 우선 원칙 (NEW)
  prompt += "\n## 🔥 산출물 우선 원칙\n";
  prompt += "전략/기획 논의가 충분히 이뤄진 이슈는 **즉시 artifact 액션으로 실제 결과물을 제출하세요**.\n\n";
  prompt += "**이슈 유형별 권장 산출물:**\n";
  prompt += "- 랜딩 페이지/마케팅 사이트 → `artifactType: \"html\"`, 완전한 `<!DOCTYPE html>...` 포함\n";
  prompt += "- 디자인 시스템/UI 컴포넌트 → `artifactType: \"html\"` (HTML+CSS 인라인) 또는 `\"css\"`\n";
  prompt += "- API 스펙/데이터 스키마 → `artifactType: \"json\"`\n";
  prompt += "- 기술 문서/사양서/기획서 → `artifactType: \"markdown\"`\n";
  prompt += "- 스크립트/로직 코드 → `artifactType: \"js\"` 또는 `\"code\"`\n\n";
  prompt += "**금지 사항:**\n";
  prompt += "- \"코드 작성은 개발팀의 일입니다\" 같은 변명\n";
  prompt += "- 추상적 설명만 남기고 실제 산출물 없이 complete\n";
  prompt += "- 전체 코드 대신 일부만 제시 (완전한 파일을 제출하세요)\n\n";
  prompt += "**artifact + complete를 같은 턴에 실행 가능**: 먼저 artifact로 파일 생성, 바로 이어서 complete로 마감.\n\n";

  // 단호한 의사결정 프레임워크
  prompt += "## 의사결정 원칙\n";
  prompt += "당신은 신속하고 단호하게 행동하는 실행가입니다. 망설이지 마세요.\n\n";
  prompt += "**완료(complete) 처리 기준** — 다음 중 하나만 만족해도 즉시 complete 처리하세요:\n";
  prompt += "1. 이슈에 대한 전략/계획이 이미 충분히 논의되어 실행 방향이 명확하다\n";
  prompt += "2. 당신이 책임질 수 있는 의사결정을 내렸다 (세부 실행은 다음 단계)\n";
  prompt += "3. 이슈 코멘트가 5개 이상이고 다음 단계로 넘어갈 수 있다\n";
  prompt += "4. 실제 산출물(artifact)을 제출했다 — 이 경우 반드시 complete\n";
  prompt += "5. \"완벽한 계획\"보다 \"결정된 방향\"이 중요하다 — 실행하면서 수정한다\n\n";
  prompt += "**절대 피해야 할 행동:**\n";
  prompt += "- \"아직 검토가 더 필요하다\"는 반복적 유보\n";
  prompt += "- 타 이슈 완료를 기다리며 무한 대기\n";
  prompt += "- 명확한 결정 없이 길게 코멘트만 남기는 것\n";
  prompt += "- 코멘트로만 설명하고 artifact 미제출\n\n";
  prompt += "**우선순위:** artifact > complete > reassign > start > comment\n";
  prompt += "이미 충분히 다뤄진 이슈는 **artifact 생성 + complete**로 즉시 마감하세요.\n";

  if (agent.adapterConfig && agent.adapterConfig.webSearchEnabled) {
    prompt += "\n- 웹 검색 도구가 활성화되어 있습니다. 필요 시 실제 검색을 통해 구체적 근거를 확보하세요\n";
    prompt += "- 단, 검색에 의존해 결정을 미루지 마세요 — 결정은 신속하게\n";
  }

  return prompt;
}

function parseAgentResponse(text) {
  try {
    var jsonMatch = text.match(/```json\s*([\s\S]*?)```/);
    if (jsonMatch) return { ...JSON.parse(jsonMatch[1]), _parseOk: true };
    var braceMatch = text.match(/\{[\s\S]*"actions"[\s\S]*\}/);
    if (braceMatch) return { ...JSON.parse(braceMatch[0]), _parseOk: true };
    return { actions: [], summary: text.substring(0, 200), _parseOk: false };
  } catch (e) {
    return { actions: [], summary: text.substring(0, 200), _parseOk: false };
  }
}

// Harness: 에이전트 출력 검증
function validateActions(actions, issues, agents) {
  var validActions = [];
  var violations = [];
  var validStatuses = ["start", "complete", "comment", "reassign", "artifact"];
  var validArtifactTypes = ["html", "css", "js", "json", "markdown", "code", "text"];
  (actions || []).forEach(function(act) {
    if (!act.issueId || !act.action) {
      violations.push("액션에 issueId 또는 action이 누락됨");
      return;
    }
    if (validStatuses.indexOf(act.action) === -1) {
      violations.push("허용되지 않는 action: " + act.action + " (허용: start, complete, comment, reassign, artifact)");
      return;
    }
    if (act.action === "artifact") {
      if (!act.artifactType || !act.artifactTitle || !act.artifactContent) {
        violations.push(act.issueId + ": artifact는 artifactType, artifactTitle, artifactContent 필수");
        return;
      }
      if (validArtifactTypes.indexOf(act.artifactType) === -1) {
        violations.push(act.issueId + ": 허용되지 않는 artifactType: " + act.artifactType);
        return;
      }
    }
    var issue = issues.find(function(i) { return i.id === act.issueId || i.identifier === act.issueId; });
    if (!issue) {
      violations.push("존재하지 않는 이슈 참조: " + act.issueId);
      return;
    }
    if (act.action === "start" && issue.status === "done") {
      violations.push(act.issueId + ": 완료된 이슈를 다시 시작할 수 없음");
      return;
    }
    if (act.action === "complete" && issue.status === "done") {
      violations.push(act.issueId + ": 이미 완료된 이슈");
      return;
    }
    if (act.action === "reassign") {
      if (!act.targetAgentId) { violations.push(act.issueId + ": reassign에 targetAgentId 누락"); return; }
      var target = (agents || []).find(function(a) { return a.id === act.targetAgentId || a.name === act.targetAgentId; });
      if (!target) { violations.push(act.issueId + ": 존재하지 않는 에이전트로 재할당: " + act.targetAgentId); return; }
      act._resolvedTargetId = target.id;
      act._resolvedTargetName = target.name;
    }
    validActions.push(act);
  });
  return { validActions: validActions, violations: violations };
}

async function executeHeartbeat(agent, data, onUpdate, runPrompt) {
  var company = data.companies[0];
  if (!company || !data.settings.apiKey) return null;

  // Budget check
  if (agent.budgetMonthlyCents > 0 && agent.spentMonthlyCents >= agent.budgetMonthlyCents) {
    return { error: "budget_exceeded", agent: agent.name };
  }

  // Approval check — 미해결 승인이 있으면 차단
  if (hasPendingApproval(data, agent.id)) {
    return { error: "pending_approval", agent: agent.name };
  }

  var model = (agent.adapterConfig && agent.adapterConfig.model) || "claude-sonnet-4-6";
  var advisorEnabled = agent.adapterConfig && agent.adapterConfig.advisorEnabled;
  var advisorModel = (agent.adapterConfig && agent.adapterConfig.advisorModel) || "claude-opus-4-6";
  var advisorMaxUses = (agent.adapterConfig && agent.adapterConfig.advisorMaxUses) || 3;
  // 도구 빌드: 웹 검색 + Advisor
  var tools = [];
  var webSearchEnabled = agent.adapterConfig && agent.adapterConfig.webSearchEnabled;
  if (webSearchEnabled) {
    tools.push({ type: "web_search_20250305", name: "web_search", max_uses: (agent.adapterConfig.webSearchMaxUses) || 3 });
  }
  if (advisorEnabled) {
    tools.push(buildAdvisorTool(advisorModel, advisorMaxUses));
  }
  var advisorTools = tools.length > 0 ? tools : null;
  var systemPrompt = (agent.adapterConfig && agent.adapterConfig.systemPrompt) || "";
  if (!systemPrompt) {
    systemPrompt = "당신은 AI 에이전트 회사의 " + (agent.title || agent.role) + "입니다. 주어진 업무를 성실히 수행하세요. 한국어로 응답하세요.";
  }
  if (data.settings.globalPrompt) {
    systemPrompt += "\n\n[전사 공통 지시]\n" + data.settings.globalPrompt;
  }
  if (runPrompt) {
    systemPrompt += "\n\n[이번 실행 지시]\n" + runPrompt;
  }
  // Brain Pack 자동 주입 — 이 에이전트에 연결된 지식 추가
  var attachedPacks = (data.brainPacks || []).filter(function(p){
    return (p.attachedAgentIds || []).indexOf(agent.id) !== -1;
  });
  if (attachedPacks.length > 0) {
    systemPrompt += "\n\n[🧠 주입된 지식 — Brain Pack " + attachedPacks.length + "개]\n";
    attachedPacks.forEach(function(p){
      // 각 팩당 최대 8KB 만 주입 (토큰 비용 관리)
      systemPrompt += "\n## " + (p.name || "Untitled") + "\n" + (p.content || "").slice(0, 8000) + "\n";
    });
  }

  var userMessage = buildAgentPrompt(agent, data.issues, data);
  var runId = uid();
  var startTime = now();
  var MAX_ATTEMPTS = 3;
  var totalCostCents = 0;
  var totalInputTokens = 0;
  var totalOutputTokens = 0;
  var totalAdvisorCalls = 0;
  var totalAdvisorInputTokens = 0;
  var totalAdvisorOutputTokens = 0;
  var allLogs = [];

  try {
    // Update agent status to working
    var updatedAgents = data.agents.map(function(a) {
      return a.id === agent.id ? { ...a, status: "working", lastHeartbeatAt: startTime, updatedAt: startTime } : a;
    });
    var tempData = { ...data, agents: updatedAgents };
    onUpdate(tempData);

    var finalParsed = null;
    var finalResponseText = "";
    var attemptCount = 0;
    var currentMessage = userMessage;

    // ===== HARNESS LOOP: 실행 → 검증 → 재시도 =====
    while (attemptCount < MAX_ATTEMPTS) {
      attemptCount++;

      // 💸 비용 절감: max_tokens 조건부 상향 (아티팩트/웹검색 있을 때만)
      var baseMaxTokens = (agent.adapterConfig && agent.adapterConfig.maxTokens) || 2048;
      var needsMoreTokens = webSearchEnabled || advisorEnabled;
      var effectiveMaxTokens = needsMoreTokens ? Math.max(baseMaxTokens, 8192) : Math.max(baseMaxTokens, 4096);
      var response = await callClaudeAPI(data.settings.apiKey, model, systemPrompt, currentMessage, effectiveMaxTokens, advisorTools);
      var responseText = response.content.map(function(c) { return c.text || ""; }).join("\n");
      var usage = response.usage || {};
      var costCents = calcCostCents(model, usage);
      totalCostCents += costCents;
      totalInputTokens += (usage.input_tokens || 0);
      totalOutputTokens += (usage.output_tokens || 0);
      var advUsage = extractAdvisorUsage(usage);
      if (advUsage) {
        totalAdvisorCalls += advUsage.calls;
        totalAdvisorInputTokens += advUsage.inputTokens;
        totalAdvisorOutputTokens += advUsage.outputTokens;
      }
      finalResponseText = responseText;

      // GATE 1: JSON 파싱 검증
      var parsed = parseAgentResponse(responseText);
      if (!parsed._parseOk && parsed.actions.length === 0) {
        if (attemptCount < MAX_ATTEMPTS) {
          allLogs.push({ id: uid(), emoji: "🔄", message: agent.icon + " " + agent.name + " [하네스] 응답 파싱 실패, 재시도 " + attemptCount + "/" + MAX_ATTEMPTS, createdAt: now() });
          currentMessage = "이전 응답이 올바른 JSON 형식이 아닙니다. 반드시 다음 형식으로 응답하세요:\n```json\n{\"actions\": [{\"issueId\": \"이슈ID\", \"action\": \"start|complete|comment|reassign|artifact\", \"comment\": \"설명\", \"targetAgentId\": \"재할당 시\", \"artifactType\": \"html/css/js/json/markdown/code/text\", \"artifactTitle\": \"파일명\", \"artifactContent\": \"파일 전체 내용\"}], \"summary\": \"요약\"}\n```\n\n" + userMessage;
          continue;
        }
        allLogs.push({ id: uid(), emoji: "⚠️", message: agent.icon + " " + agent.name + " [하네스] 파싱 실패 " + MAX_ATTEMPTS + "회 — 원본 응답 저장", createdAt: now() });
        finalParsed = parsed;
        break;
      }

      // GATE 2: 액션 유효성 검증
      var validation = validateActions(parsed.actions, tempData.issues, tempData.agents);
      if (validation.violations.length > 0) {
        allLogs.push({ id: uid(), emoji: "🛡️", message: agent.icon + " " + agent.name + " [하네스] 검증 위반 " + validation.violations.length + "건 차단: " + validation.violations.join(", ").substring(0, 100), createdAt: now() });
      }

      // 유효한 액션만 적용
      parsed.actions = validation.validActions;
      finalParsed = parsed;
      break;
    }

    if (!finalParsed) finalParsed = { actions: [], summary: "" };

    // Apply validated actions to issues
    var updatedIssues = [...tempData.issues];
    var actionLogs = [];
    if (finalParsed.actions && finalParsed.actions.length > 0) {
      finalParsed.actions.forEach(function(act) {
        updatedIssues = updatedIssues.map(function(issue) {
          if (issue.id === act.issueId || issue.identifier === act.issueId) {
            var changes = { updatedAt: now() };
            var comments = issue.comments ? [...issue.comments] : [];
            var artifacts = issue.artifacts ? [...issue.artifacts] : [];
            if (act.action === "start") { changes.status = "in_progress"; changes.startedAt = now(); }
            else if (act.action === "complete") { changes.status = "done"; changes.completedAt = now(); }
            else if (act.action === "reassign") {
              changes.assigneeAgentId = act._resolvedTargetId || act.targetAgentId;
              comments.push({ id: uid(), agentId: agent.id, agentName: agent.name, content: "→ " + (act._resolvedTargetName || act.targetAgentId) + "에게 재할당" + (act.comment ? ": " + act.comment : ""), type: "delegation", createdAt: now() });
            }
            else if (act.action === "artifact") {
              artifacts.push({
                id: uid(), agentId: agent.id, agentName: agent.name,
                type: act.artifactType, title: act.artifactTitle,
                content: act.artifactContent, description: act.artifactDescription || "",
                createdAt: now()
              });
              // 타임라인에 노출되도록 trace 코멘트 추가
              comments.push({ id: uid(), agentId: agent.id, agentName: agent.name,
                content: "📎 아티팩트 생성: " + act.artifactTitle + (act.artifactDescription ? " — " + act.artifactDescription : ""),
                type: "artifact", createdAt: now() });
            }
            if (act.comment && act.action !== "reassign" && act.action !== "artifact") {
              comments.push({ id: uid(), agentId: agent.id, agentName: agent.name, content: act.comment, type: act.action === "complete" ? "review" : "comment", createdAt: now() });
            }
            changes.comments = comments;
            changes.artifacts = artifacts;
            var emoji = act.action === "complete" ? "✅" : act.action === "reassign" ? "🔀" : act.action === "artifact" ? "📎" : act.action === "start" ? "🔄" : "💬";
            var label = act.action === "complete" ? "완료" : act.action === "start" ? "진행 중" : act.action === "reassign" ? ("→" + (act._resolvedTargetName || "") + " 재할당") : act.action === "artifact" ? ("아티팩트 " + (act.artifactTitle || "")) : "코멘트";
            actionLogs.push({ id: uid(), emoji: emoji, message: agent.icon + " " + agent.name + ": " + (issue.identifier || "") + " " + label + (act.comment ? " — " + act.comment.substring(0, 80) : ""), createdAt: now() });
            return { ...issue, ...changes };
          }
          return issue;
        });
      });
    }

    // 목표 진행률 자동 업데이트
    var goalRecalc = recalcGoalProgress({ ...tempData, issues: updatedIssues });
    updatedIssues = goalRecalc.issues;
    var goalLogs = [];
    if (goalRecalc.goals) {
      goalRecalc.goals.forEach(function(g, idx) {
        var orig = tempData.goals[idx];
        if (orig && orig.progress !== g.progress) {
          goalLogs.push({ id: uid(), emoji: "🎯", message: "목표 \"" + g.title + "\" 진행률: " + orig.progress + "% → " + g.progress + "%" + (g.status === "completed" ? " (완료!)" : ""), createdAt: now() });
        }
      });
    }

    // 재할당 시 자동 승인 요청
    var autoApprovals = [...(tempData.approvals || [])];
    var approvalLogs = [];
    if (finalParsed.actions) {
      finalParsed.actions.forEach(function(act) {
        if (act.action === "reassign") {
          var issue = updatedIssues.find(function(i) { return i.id === act.issueId || i.identifier === act.issueId; });
          var apTitle = agent.name + ": " + (issue ? issue.identifier : act.issueId) + " 재할당 → " + (act._resolvedTargetName || act.targetAgentId);
          var ap = { id: uid(), title: apTitle, description: act.comment || "", type: "action", requesterId: agent.id, status: "pending", autoGenerated: true, createdAt: now(), updatedAt: now(), resolvedAt: null, resolvedBy: null };
          autoApprovals.push(ap);
          approvalLogs.push({ id: uid(), emoji: "🛡️", message: "[자동] 승인 요청: " + apTitle, createdAt: now() });
        }
      });
    }

    // Record cost event (total across all attempts)
    var costEvent = {
      id: uid(), companyId: company.id, agentId: agent.id, provider: "anthropic",
      model: model, inputTokens: totalInputTokens,
      cachedInputTokens: 0,
      outputTokens: totalOutputTokens, costCents: totalCostCents,
      advisorEnabled: !!advisorEnabled, advisorModel: advisorEnabled ? advisorModel : null,
      advisorCalls: totalAdvisorCalls, advisorInputTokens: totalAdvisorInputTokens, advisorOutputTokens: totalAdvisorOutputTokens,
      occurredAt: now(), createdAt: now(),
    };

    // Record heartbeat run
    var hbRun = {
      id: runId, companyId: company.id, agentId: agent.id, model: model,
      status: "completed", inputTokens: totalInputTokens,
      outputTokens: totalOutputTokens, costCents: totalCostCents,
      advisorEnabled: !!advisorEnabled, advisorModel: advisorEnabled ? advisorModel : null,
      advisorCalls: totalAdvisorCalls, advisorInputTokens: totalAdvisorInputTokens, advisorOutputTokens: totalAdvisorOutputTokens,
      attempts: attemptCount,
      summary: finalParsed.summary || "", responseExcerpt: finalResponseText.substring(0, 500),
      startedAt: startTime, completedAt: now(),
    };

    // Update agent spent + status back to idle
    var finalAgents = tempData.agents.map(function(a) {
      if (a.id === agent.id) {
        return { ...a, status: "idle", spentMonthlyCents: a.spentMonthlyCents + totalCostCents, lastHeartbeatAt: now(), updatedAt: now() };
      }
      return a;
    });

    var attemptNote = attemptCount > 1 ? " (" + attemptCount + "회 시도)" : "";
    var advisorNote = advisorEnabled && totalAdvisorCalls > 0 ? " 🧠Advisor(" + (MODELS[advisorModel] || {}).name + " x" + totalAdvisorCalls + ")" : advisorEnabled ? " 🧠Advisor(대기)" : "";
    actionLogs.push({ id: uid(), emoji: "💓", message: agent.icon + " " + agent.name + " heartbeat 완료" + attemptNote + advisorNote + " — " + totalInputTokens + "+" + totalOutputTokens + " tokens, $" + (totalCostCents / 100).toFixed(2), createdAt: now() });

    var finalData = {
      ...tempData,
      agents: finalAgents,
      issues: updatedIssues,
      goals: goalRecalc.goals || tempData.goals,
      approvals: autoApprovals,
      costEvents: [...tempData.costEvents, costEvent],
      heartbeatRuns: [...tempData.heartbeatRuns, hbRun],
      activityLog: [...tempData.activityLog, ...allLogs, ...actionLogs, ...goalLogs, ...approvalLogs],
    };
    onUpdate(finalData);
    return { success: true, run: hbRun, costCents: totalCostCents, attempts: attemptCount };

  } catch (err) {
    // Set agent to error
    var errAgents = data.agents.map(function(a) {
      return a.id === agent.id ? { ...a, status: "error", updatedAt: now() } : a;
    });
    var errLog = { id: uid(), emoji: "❌", message: agent.icon + " " + agent.name + " heartbeat 실패: " + err.message.substring(0, 100), createdAt: now() };
    var errRun = { id: runId, companyId: company.id, agentId: agent.id, model: model, status: "error", error: err.message, startedAt: startTime, completedAt: now(), costCents: totalCostCents, attempts: attemptCount || 0 };
    onUpdate({ ...data, agents: errAgents, heartbeatRuns: [...data.heartbeatRuns, errRun], activityLog: [...data.activityLog, ...allLogs, errLog] });
    return { success: false, error: err.message };
  }
}

// 전역 협업 중단 플래그
var COLLAB_ABORT = { current: false };

async function runCollaborationHeartbeat(data, onUpdate, maxRounds, onProgress, delaySeconds) {
  var company = data.companies[0];
  if (!company || !data.settings.apiKey) return { success: false, error: "API 키 또는 회사 미설정" };

  COLLAB_ABORT.current = false;
  var order = getExecutionOrder(data.agents);
  // 계층 없으면 전체를 workers로 처리
  if (order.managers.length === 0) { order.workers = data.agents.filter(function(a) { return a.status !== "paused"; }); }

  var totalCostCents = 0;
  var totalAgentRuns = 0;
  var roundResults = [];
  var startTime = now();
  var aborted = false;
  var delayMs = (delaySeconds || 0) * 1000;

  // 중단 가능한 sleep 함수
  var sleep = function(ms) {
    return new Promise(function(resolve) {
      var start = Date.now();
      var iv = setInterval(function() {
        if (COLLAB_ABORT.current || Date.now() - start >= ms) {
          clearInterval(iv);
          resolve();
        }
      }, 500);
    });
  };

  for (var round = 1; round <= maxRounds; round++) {
    if (COLLAB_ABORT.current) { aborted = true; break; }
    var roundChanges = 0;

    // 매니저 페이즈
    if (order.managers.length > 0) {
      for (var m = 0; m < order.managers.length; m++) {
        if (COLLAB_ABORT.current) { aborted = true; break; }
        var mgr = order.managers[m];
        if (onProgress) onProgress({ round: round, maxRounds: maxRounds, phase: "manager", agentName: mgr.name, agentIcon: mgr.icon, waiting: false });
        var freshData = load() || data;
        var freshAgent = freshData.agents.find(function(a) { return a.id === mgr.id; }) || mgr;
        if (freshAgent.budgetMonthlyCents > 0 && freshAgent.spentMonthlyCents >= freshAgent.budgetMonthlyCents) continue;
        var roundPrompt = round === 1 ? "팀의 이슈를 검토하고 팀원들에게 지시/코멘트를 남겨주세요. 필요하면 이슈를 재할당하세요." : "팀원들의 작업 결과를 검토하고 피드백을 남겨주세요.";
        var result = await executeHeartbeat(freshAgent, freshData, function(d) { save(d); onUpdate(d); }, roundPrompt);
        if (result && result.success) { totalCostCents += result.costCents || 0; totalAgentRuns++; roundChanges++; }
        roundResults.push({ round: round, phase: "manager", agentId: mgr.id, agentName: mgr.name, success: result ? result.success : false, costCents: result ? result.costCents || 0 : 0 });
        // rate limit 회피 지연 (마지막 호출 후엔 생략)
        if (delayMs > 0 && (m < order.managers.length - 1 || order.workers.length > 0)) {
          if (onProgress) onProgress({ round: round, maxRounds: maxRounds, phase: "manager", agentName: "대기 중 (rate limit 회피)", agentIcon: "⏳", waiting: true });
          await sleep(delayMs);
        }
      }
    }
    if (aborted) break;

    // 실무자 페이즈
    for (var w = 0; w < order.workers.length; w++) {
      if (COLLAB_ABORT.current) { aborted = true; break; }
      var wkr = order.workers[w];
      if (onProgress) onProgress({ round: round, maxRounds: maxRounds, phase: "worker", agentName: wkr.name, agentIcon: wkr.icon, waiting: false });
      var freshData2 = load() || data;
      var freshAgent2 = freshData2.agents.find(function(a) { return a.id === wkr.id; }) || wkr;
      if (freshAgent2.budgetMonthlyCents > 0 && freshAgent2.spentMonthlyCents >= freshAgent2.budgetMonthlyCents) continue;
      var roundPrompt2 = round === 1 ? "매니저의 코멘트를 확인하고 할당된 이슈를 진행해주세요." : "이전 피드백을 반영하여 이슈를 업데이트해주세요.";
      var result2 = await executeHeartbeat(freshAgent2, freshData2, function(d) { save(d); onUpdate(d); }, roundPrompt2);
      if (result2 && result2.success) { totalCostCents += result2.costCents || 0; totalAgentRuns++; roundChanges++; }
      roundResults.push({ round: round, phase: "worker", agentId: wkr.id, agentName: wkr.name, success: result2 ? result2.success : false, costCents: result2 ? result2.costCents || 0 : 0 });
      if (delayMs > 0 && (w < order.workers.length - 1 || round < maxRounds)) {
        if (onProgress) onProgress({ round: round, maxRounds: maxRounds, phase: "worker", agentName: "대기 중 (rate limit 회피)", agentIcon: "⏳", waiting: true });
        await sleep(delayMs);
      }
    }
    if (aborted) break;

    // 변경 없으면 조기 종료
    if (round < maxRounds && roundChanges === 0) break;
  }

  // 협업 요약 로그
  var finalData = load() || data;
  var statusLabel = aborted ? "중단됨" : "완료";
  var collabLog = { id: uid(), emoji: aborted ? "⏹" : "🤝", message: "협업 Heartbeat " + statusLabel + " — " + roundResults.length + "회 실행, " + maxRounds + " 라운드, $" + (totalCostCents / 100).toFixed(2), createdAt: now() };
  var collabRun = {
    id: uid(), companyId: company.id, agentId: "collaboration", model: "multi",
    status: aborted ? "aborted" : "completed", mode: "collaboration", rounds: maxRounds,
    agentResults: roundResults, costCents: totalCostCents,
    summary: (aborted ? "[중단됨] " : "") + "매니저 " + order.managers.length + "명 + 실무자 " + order.workers.length + "명, " + totalAgentRuns + "회 실행",
    startedAt: startTime, completedAt: now(),
  };
  onUpdate({ ...finalData, heartbeatRuns: [...finalData.heartbeatRuns, collabRun], activityLog: [...finalData.activityLog, collabLog] });
  save(load());

  if (onProgress) onProgress(null);
  return { success: true, costCents: totalCostCents, rounds: maxRounds, agentRuns: totalAgentRuns };
}

async function runDemoSimulation(data, onUpdate, onProgress) {
  var DELAY = 1500;
  var agentOrder = ["김리더", "이기술", "박피엠", "강마케팅", "서디자인", "최개발"];

  for (var i = 0; i < DEMO_EVENTS.length; i++) {
    var evt = DEMO_EVENTS[i];
    if (onProgress) onProgress({ round: Math.ceil((i+1)/6), maxRounds: 2, phase: evt.type === "complete" ? "manager" : "worker", agentName: evt.agent, agentIcon: evt.icon });

    await new Promise(function(r){ setTimeout(r, evt.delay); });

    var fresh = load() || data;
    var issue = fresh.issues[evt.issueIdx];
    if (!issue) continue;
    var agent = fresh.agents.find(function(a){return a.name === evt.agent});

    if (evt.type === "comment") {
      issue.comments = issue.comments || [];
      issue.comments.push({ id: uid(), agentId: agent ? agent.id : "demo", agentName: evt.agent, content: evt.content, type: "comment", createdAt: now() });
      if (issue.status === "todo") { issue.status = "in_progress"; issue.startedAt = now(); }
    } else if (evt.type === "artifact") {
      issue.artifacts = issue.artifacts || [];
      issue.artifacts.push({ id: uid(), agentId: agent ? agent.id : "demo", agentName: evt.agent, type: evt.artifactType, title: evt.artifactTitle, content: evt.artifactContent, description: evt.artifactDescription, createdAt: now() });
      issue.comments = issue.comments || [];
      issue.comments.push({ id: uid(), agentId: agent ? agent.id : "demo", agentName: evt.agent, content: "📎 아티팩트 생성: " + evt.artifactTitle, type: "artifact", createdAt: now() });
    } else if (evt.type === "complete") {
      issue.status = "done";
      issue.completedAt = now();
    }

    fresh.activityLog.push({ id: uid(), emoji: evt.type === "artifact" ? "📎" : evt.type === "complete" ? "✅" : "💬", message: "[DEMO] " + evt.icon + " " + evt.agent + " · " + issue.identifier + " " + (evt.type === "artifact" ? "아티팩트 생성: " + evt.artifactTitle : evt.type === "complete" ? "완료" : "코멘트"), createdAt: now() });
    save(fresh);
    onUpdate(fresh);
  }

  // 목표 진행률 재계산
  var finalData = load();
  finalData = recalcGoalProgress(finalData);
  var collabRun = { id: uid(), companyId: finalData.companies[0].id, agentId: "collaboration", model: "demo", status: "completed", mode: "collaboration", rounds: 2, costCents: 0, summary: "[DEMO] 6명 팀 협업 시뮬레이션 완료", startedAt: now(), completedAt: now() };
  finalData.heartbeatRuns.push(collabRun);
  finalData.activityLog.push({ id: uid(), emoji: "🎉", message: "[DEMO] 협업 완료! 실제 사용하려면 설정에서 API 키를 입력하세요.", createdAt: now() });
  save(finalData);
  onUpdate(finalData);
  if (onProgress) onProgress(null);

  // 완료 축하 + CTA 모달 표시
  setTimeout(function() {
    if (typeof window.__showDemoCompleteModal === "function") window.__showDemoCompleteModal();
  }, 500);

  return { success: true, demo: true };
}

  var hasLock = !!localStorage.getItem(LOCK_KEY);
  const [mode, setMode] = useState(hasLock ? "login" : "setup");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");

  const handleSetup = async () => {
    if (pw.length < 4) { setError("비밀번호는 4자 이상이어야 합니다."); return; }
    if (pw !== pw2) { setError("비밀번호가 일치하지 않습니다."); return; }
    var hash = await hashPassword(pw);
    localStorage.setItem(LOCK_KEY, hash);
    sessionStorage.setItem(AUTH_KEY, "1");
    onUnlock();
  };

  const handleLogin = async () => {
    if (!pw) { setError("비밀번호를 입력해주세요."); return; }
    var hash = await hashPassword(pw);
    var stored = localStorage.getItem(LOCK_KEY);
    if (hash === stored) {
      sessionStorage.setItem(AUTH_KEY, "1");
      setError("");
      onUnlock();
    } else {
      setError("비밀번호가 틀렸습니다.");
    }
  };

  const handleKey = (e) => { if (e.key === "Enter") { mode === "setup" ? handleSetup() : handleLogin(); } };

  return (
    <div className="setup-screen">
      <div className="setup-card">
        <div style={{fontSize:48,marginBottom:16}}>🔒</div>
        <h1 style={{fontSize:24,marginBottom:8}}>JWAY Paperclip</h1>
        {mode === "setup" ? (
          <div>
            <p style={{color:"var(--text-secondary)",marginBottom:24}}>처음 사용하시네요! 비밀번호를 설정해주세요.</p>
            <div style={{textAlign:"left",display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <label className="text-sm font-medium" style={{display:"block",marginBottom:4}}>비밀번호</label>
                <input className="input" type="password" value={pw} onChange={function(e){setPw(e.target.value);setError("")}} onKeyDown={handleKey} placeholder="4자 이상" autoFocus/>
              </div>
              <div>
                <label className="text-sm font-medium" style={{display:"block",marginBottom:4}}>비밀번호 확인</label>
                <input className="input" type="password" value={pw2} onChange={function(e){setPw2(e.target.value);setError("")}} onKeyDown={handleKey} placeholder="다시 입력"/>
              </div>
              {error && <div className="text-sm" style={{color:"var(--danger)"}}>{error}</div>}
              <button className="btn btn-primary" style={{justifyContent:"center",padding:12,width:"100%"}} onClick={handleSetup}>비밀번호 설정 →</button>
            </div>
          </div>
        ) : (
          <div>
            <p style={{color:"var(--text-secondary)",marginBottom:24}}>비밀번호를 입력해주세요.</p>
            <div style={{textAlign:"left",display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <label className="text-sm font-medium" style={{display:"block",marginBottom:4}}>비밀번호</label>
                <input className="input" type="password" value={pw} onChange={function(e){setPw(e.target.value);setError("")}} onKeyDown={handleKey} placeholder="비밀번호" autoFocus/>
              </div>
              {error && <div className="text-sm" style={{color:"var(--danger)"}}>{error}</div>}
              <button className="btn btn-primary" style={{justifyContent:"center",padding:12,width:"100%"}} onClick={handleLogin}>로그인 →</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function DashboardPage({ data, onUpdate }) {
  const co = data.companies[0];
  const n = new Date();
  const mc = data.costEvents.filter(e=>{const d=new Date(e.occurredAt);return d.getUTCFullYear()===n.getUTCFullYear()&&d.getUTCMonth()===n.getUTCMonth();});
  const ts = mc.reduce((s,e)=>s+(e.costCents||0),0);

  const [quickInput, setQuickInput] = useState("");
  const [quickLoading, setQuickLoading] = useState(false);
  const [quickResult, setQuickResult] = useState(null);

  const analyzeTask = async () => {
    if (!quickInput.trim() || !data.settings.apiKey) return;
    if (DEMO_MODE) {
      alert("🎬 데모 모드에서는 퀵 실행을 사용할 수 없습니다.\n\n실제 AI 분석이 필요하므로 API 키가 필요합니다.\n\n정식 버전에서 이 기능을 사용하려면 오른쪽 위 '🚀 정식 시작' 버튼을 클릭하세요.");
      return;
    }
    setQuickLoading(true);
    setQuickResult(null);
    try {
      var roleList = Object.keys(ROLE_CAPS).join(", ");
      var existingAgents = data.agents.map(function(a) { return a.name + "(" + a.role + ")" ; }).join(", ");
      var res = await callClaudeAPI(data.settings.apiKey, "claude-haiku-4-5-20251001",
        "당신은 AI 에이전트 회사의 조직 설계자입니다. 사용자의 목표를 달성하기 위해 필요한 팀을 구성하세요. 목표의 규모에 맞게 2~6명의 팀을 추천하세요. 리더를 반드시 1명 포함하세요.\n\n각 에이전트의 capabilities는 해당 프로젝트에 특화된 구체적인 역량을 5~8개 나열하세요.\nsystemPrompt는 에이전트가 이 프로젝트에서 어떻게 행동해야 하는지 구체적으로 지시하는 2~4문장의 프롬프트를 작성하세요. 역할, 전문 분야, 작업 방식, 응답 스타일을 포함하세요.\n\n반드시 JSON만 출력하세요.",
        "사용자 목표: \"" + quickInput + "\"\n\n사용 가능한 역할: " + roleList + "\n기존 에이전트: " + (existingAgents || "없음") + "\n\n다음 JSON 형식으로만 응답:\n```json\n{\n  \"projectName\": \"프로젝트 이름\",\n  \"projectDescription\": \"프로젝트 설명\",\n  \"team\": [\n    {\n      \"name\": \"한국어 이름\",\n      \"role\": \"역할키\",\n      \"title\": \"직함\",\n      \"icon\": \"이모지1개\",\n      \"isLeader\": true/false,\n      \"capabilities\": \"이 프로젝트에 특화된 구체적 역량 (쉼표 구분, 5~8개)\",\n      \"systemPrompt\": \"이 에이전트의 행동 지침 (2~4문장, 역할/전문분야/작업방식/응답스타일 포함)\",\n      \"issueTitle\": \"이 에이전트에게 배정할 이슈 제목\",\n      \"issueDescription\": \"이슈 설명\",\n      \"existingAgentName\": \"기존 에이전트가 적합하면 이름, 아니면 null\"\n    }\n  ]\n}\n```", 4096);
      var text = res.content.map(function(c) { return c.text || ""; }).join("");
      var jsonMatch = text.match(/```json\s*([\s\S]*?)```/) || text.match(/\{[\s\S]*"team"[\s\S]*\}/);
      var parsed = JSON.parse(jsonMatch ? (jsonMatch[1] || jsonMatch[0]) : text);
      if (parsed.team) {
        parsed.team.forEach(function(m) {
          m._existingAgent = m.existingAgentName ? data.agents.find(function(a) { return a.name === m.existingAgentName; }) : null;
        });
      }
      setQuickResult(parsed);
    } catch (e) {
      alert("분석 실패: " + e.message);
    }
    setQuickLoading(false);
  };

  const confirmQuick = () => {
    var r = quickResult;
    if (!r || !r.team || r.team.length === 0) return;
    var coId = co ? co.id : "";
    var issueNum = co ? co.issueCounter || 0 : 0;
    var prefix = co ? co.issuePrefix || "JWAY" : "JWAY";
    var newAgents = [...data.agents];
    var newIssues = [...data.issues];
    var logs = [];
    var leaderId = null;

    // 프로젝트 생성
    var proj = { id: uid(), companyId: coId, name: r.projectName || quickInput, description: r.projectDescription || "", status: "active", createdAt: now(), updatedAt: now() };
    logs.push({ id: uid(), emoji: "📁", message: "퀵 실행: 프로젝트 \"" + proj.name + "\" 생성됨", createdAt: now() });

    // 리더 먼저 처리
    var leader = r.team.find(function(m) { return m.isLeader; }) || r.team[0];

    r.team.forEach(function(m) {
      var agentId;
      if (m._existingAgent) {
        agentId = m._existingAgent.id;
        logs.push({ id: uid(), emoji: "🔄", message: "퀵 실행: 기존 " + m._existingAgent.name + " 활용", createdAt: now() });
      } else {
        // 🎯 리더(CEO/CTO/PM 등) → Opus, 일반 → Sonnet
        var isLeader = m.isLeader || isLeaderRole(m.role);
        var agentModel = isLeader ? DEFAULT_LEADER_MODEL : DEFAULT_MODEL;
        var newAgent = { id: uid(), companyId: coId, name: m.name, role: m.role || "general", title: m.title || "", icon: m.icon || "🤖", status: "idle", reportsTo: null, capabilities: m.capabilities || ROLE_CAPS[m.role] || "", adapterType: "claude_api", adapterConfig: { model: agentModel, systemPrompt: m.systemPrompt || "", maxTokens: 4096, advisorEnabled: false, advisorModel: "claude-opus-4-6", advisorMaxUses: 2, webSearchEnabled: false, webSearchMaxUses: 3 }, runtimeConfig: {}, budgetMonthlyCents: isLeader ? 5000 : 2000, spentMonthlyCents: 0, permissions: { canCreateIssues: true, canHireAgents: false }, lastHeartbeatAt: null, createdAt: now(), updatedAt: now() };
        agentId = newAgent.id;
        if (m === leader) leaderId = agentId;
        newAgents.push(newAgent);
        logs.push({ id: uid(), emoji: "🚀", message: "퀵 실행: " + m.icon + " " + m.name + (m.isLeader ? " (리더)" : "") + " 생성됨", createdAt: now() });
      }
      if (m === leader) leaderId = agentId;

      issueNum++;
      var issue = { id: uid(), companyId: coId, projectId: proj.id, goalId: null, parentId: null, title: m.issueTitle || m.name + " 업무", description: m.issueDescription || "", status: "todo", priority: m.isLeader ? "high" : "medium", assigneeAgentId: agentId, issueNumber: issueNum, identifier: prefix + "-" + issueNum, originKind: "quick", createdAt: now(), updatedAt: now(), startedAt: null, completedAt: null };
      newIssues.push(issue);
    });

    // 리더가 아닌 에이전트의 reportsTo를 리더로 설정
    if (leaderId) {
      newAgents = newAgents.map(function(a) {
        var member = r.team.find(function(m) { return !m._existingAgent && m.name === a.name && m !== leader; });
        if (member && a.id !== leaderId && !a.reportsTo) return { ...a, reportsTo: leaderId };
        return a;
      });
    }

    var updatedCo = co ? { ...co, issueCounter: issueNum } : co;
    onUpdate({ ...data, agents: newAgents, issues: newIssues, projects: [...data.projects, proj], companies: data.companies.map(function(c) { return c.id === coId ? updatedCo : c; }), activityLog: [...data.activityLog, ...logs] });
    setQuickInput("");
    setQuickResult(null);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {DEMO_MODE && (
        <div className="card" style={{padding:14,background:"linear-gradient(135deg,#fff7ed,#fef3c7)",border:"1px solid #fbbf24"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{fontSize:32}}>🎬</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:15,color:"#92400e"}}>데모 모드 진행 방법</div>
              <div style={{fontSize:13,color:"#78350f",marginTop:2}}>왼쪽 <strong>💓 Heartbeat</strong> → 상단 <strong>🤝 협업</strong> 버튼 클릭 → 30초 대기</div>
            </div>
            <button className="btn btn-primary" style={{background:"linear-gradient(135deg,#f59e0b,#ef4444)",border:"none",fontSize:13}} onClick={function(){ window.location.hash="#heartbeat"; }}>지금 시작 →</button>
          </div>
        </div>
      )}
      <div className="card" style={{padding:14,opacity:DEMO_MODE?0.5:1,position:"relative"}}>
        <div className="font-medium" style={{marginBottom:8,fontSize:14}}>🚀 무엇을 하고 싶으세요? {DEMO_MODE && <span style={{fontSize:11,color:"var(--danger)",fontWeight:600}}>(데모 모드에서는 비활성)</span>}</div>
        <div style={{display:"flex",gap:8}}>
          <input className="input" placeholder={DEMO_MODE ? "정식 버전에서만 사용 가능합니다" : "예: 마케팅 전략을 세워줘, 랜딩 페이지 만들어줘, 블로그 글 써줘..."} value={quickInput} onChange={e=>setQuickInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")analyzeTask()}} style={{flex:1}} disabled={DEMO_MODE}/>
          <button className="btn btn-primary" onClick={analyzeTask} disabled={quickLoading||!quickInput.trim()||DEMO_MODE}>{quickLoading?"분석 중...":"🚀 실행"}</button>
        </div>
        {quickResult && quickResult.team && (
          <div style={{marginTop:12,padding:12,background:"var(--bg-secondary)",borderRadius:"var(--radius)",border:"1px solid var(--border)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div>
                <div style={{fontSize:14,fontWeight:600}}>📁 {quickResult.projectName||"프로젝트"}</div>
                {quickResult.projectDescription && <div style={{fontSize:11,color:"var(--text-secondary)",marginTop:2}}>{quickResult.projectDescription}</div>}
              </div>
              <span style={{fontSize:12,color:"var(--accent)",fontWeight:500}}>{quickResult.team.length}명 팀</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,marginBottom:10}}>
              {quickResult.team.map(function(m,i) {
                return (
                  <div key={i} style={{padding:"10px 12px",background:"var(--bg-primary)",borderRadius:8,border:m.isLeader?"2px solid var(--accent)":"1px solid var(--border)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                      <span style={{fontSize:18}}>{m.icon||"🤖"}</span>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:600}}>{m.name}{m.isLeader?" ⭐":""} <span style={{fontWeight:400,color:"var(--text-secondary)"}}>{m.title||m.role}</span></div>
                      </div>
                      {m._existingAgent && <span style={{fontSize:10,color:"var(--info)",background:"var(--info-light)",padding:"0 4px",borderRadius:4}}>기존</span>}
                    </div>
                    <div style={{fontSize:11,color:"var(--text-secondary)",padding:"4px 6px",background:"var(--bg-tertiary)",borderRadius:4}}>📋 {m.issueTitle||"업무 배정"}</div>
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn btn-primary" style={{fontSize:12}} onClick={confirmQuick}>✅ 팀 생성 + 프로젝트 + 이슈 배정</button>
              <button className="btn" style={{fontSize:12}} onClick={()=>setQuickResult(null)}>취소</button>
            </div>
          </div>
        )}
      </div>

      <div className="card-grid">
        <div className="card metric-card" style={{padding:14}}><div className="metric-label">활성 에이전트</div><div className="metric-value">{data.agents.filter(a=>a.status!=="paused").length}<span style={{fontSize:13,fontWeight:400,color:"var(--text-tertiary)"}}>{" / "+data.agents.length}</span></div></div>
        <div className="card metric-card" style={{padding:14}}><div className="metric-label">진행 중 이슈</div><div className="metric-value">{data.issues.filter(i=>i.status==="in_progress").length}<span style={{fontSize:13,fontWeight:400,color:"var(--text-tertiary)"}}>{" / "+data.issues.length}</span></div></div>
        <div className="card metric-card" style={{padding:14}}><div className="metric-label">이번 달 비용</div><div className="metric-value">{"$"+(ts/100).toFixed(2)}<span style={{fontSize:13,fontWeight:400,color:"var(--text-tertiary)"}}>{" / $"+(co?(co.budgetMonthlyCents/100).toFixed(0):0)}</span></div></div>
        <div className="card metric-card" style={{padding:14}}><div className="metric-label">승인 대기</div><div className="metric-value">{data.approvals.filter(a=>a.status==="pending").length}</div></div>
      </div>
      {/* 이슈 진행률 + 에이전트 성과 */}
      {(function() {
        var totalIssues = data.issues.length;
        var doneIssues = data.issues.filter(function(i){return i.status==="done"}).length;
        var inProgress = data.issues.filter(function(i){return i.status==="in_progress"}).length;
        var todoIssues = data.issues.filter(function(i){return i.status==="todo"}).length;
        var backlog = data.issues.filter(function(i){return i.status==="backlog"}).length;
        var donePct = totalIssues > 0 ? Math.round(doneIssues / totalIssues * 100) : 0;
        var totalComments = data.issues.reduce(function(s,i){return s+(i.comments||[]).length},0);
        var collabRuns = data.heartbeatRuns.filter(function(r){return r.mode==="collaboration"}).length;
        var totalHbRuns = data.heartbeatRuns.length;

        // 에이전트별 성과
        var agentStats = data.agents.map(function(a) {
          var assigned = data.issues.filter(function(i){return i.assigneeAgentId===a.id}).length;
          var completed = data.issues.filter(function(i){return i.assigneeAgentId===a.id && i.status==="done"}).length;
          var comments = data.issues.reduce(function(s,i){return s+(i.comments||[]).filter(function(c){return c.agentId===a.id}).length},0);
          var runs = data.heartbeatRuns.filter(function(r){return r.agentId===a.id && r.status==="completed"}).length;
          return {agent:a, assigned:assigned, completed:completed, comments:comments, runs:runs, rate:assigned>0?Math.round(completed/assigned*100):0};
        }).sort(function(a,b){return b.completed-a.completed});

        return (
          <React.Fragment>
            {/* 진행률 바 */}
            {totalIssues > 0 && (
              <div className="card" style={{padding:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>

                </div>
                <div style={{display:"flex",height:24,borderRadius:12,overflow:"hidden",background:"var(--bg-tertiary)"}}>
                  {doneIssues > 0 && <div title={"완료 "+doneIssues} style={{width:(doneIssues/totalIssues*100)+"%",background:"var(--success)",transition:"width 0.3s"}}/>}
                  {inProgress > 0 && <div title={"진행중 "+inProgress} style={{width:(inProgress/totalIssues*100)+"%",background:"var(--warning)",transition:"width 0.3s"}}/>}
                  {todoIssues > 0 && <div title={"할일 "+todoIssues} style={{width:(todoIssues/totalIssues*100)+"%",background:"var(--info)",transition:"width 0.3s"}}/>}

                  <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"var(--bg-tertiary)",marginRight:4}}/>{"백로그 "+backlog}</span>
                </div>
              </div>
            )}

            {/* 협업 요약 */}
            <div className="card-grid">
              <div className="card metric-card" style={{padding:14}}><div className="metric-label">Heartbeat 실행</div><div className="metric-value">{totalHbRuns}</div><div className="metric-sub">{"협업 "+collabRuns+"회"}</div></div>
              <div className="card metric-card" style={{padding:14}}><div className="metric-label">코멘트</div><div className="metric-value">{totalComments}</div><div className="metric-sub">에이전트 간 대화</div></div>
              <div className="card metric-card" style={{padding:14}}><div className="metric-label">완료 이슈</div><div className="metric-value">{doneIssues}<span style={{fontSize:13,fontWeight:400,color:"var(--text-tertiary)"}}>{" / "+totalIssues}</span></div></div>
              <div className="card metric-card" style={{padding:14}}><div className="metric-label">완료율</div><div className="metric-value">{donePct+"%"}</div></div>
            </div>

            {/* 에이전트 성과 + 최근 활동 */}
            <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
              <div className="card" style={{flex:"1 1 400px",padding:14}}>
                <div className="font-medium" style={{marginBottom:10,fontSize:14}}>에이전트 성과</div>
                {agentStats.length===0
                  ?<div className="text-sm text-muted" style={{padding:16,textAlign:"center"}}>에이전트가 없습니다</div>
                  :agentStats.map(function(s) {
                    return (
                      <div key={s.agent.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:"1px solid var(--border)"}}>
                        <span style={{fontSize:18}}>{s.agent.icon||"🤖"}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{fontSize:12,fontWeight:600}}>{s.agent.name}</span>
                            <span className={"badge badge-"+s.agent.status} style={{fontSize:9,padding:"0 4px"}}>{s.agent.status}</span>
                          </div>
                          <div style={{display:"flex",height:6,borderRadius:3,overflow:"hidden",background:"var(--bg-tertiary)",marginTop:4}}>
                            <div style={{width:s.rate+"%",background:s.rate>=80?"var(--success)":s.rate>=50?"var(--warning)":"var(--info)",transition:"width 0.3s"}}/>
                          </div>
                        </div>
                        <div style={{textAlign:"right",fontSize:11,color:"var(--text-secondary)",whiteSpace:"nowrap"}}>
                          <div>{s.completed+"/"+s.assigned+" 이슈"}</div>
                          <div>{s.comments > 0 ? s.comments+" 코멘트" : ""}{s.runs > 0 ? " | "+s.runs+"회 실행":""}</div>
                        </div>
                      </div>
                    );
                  })
                }
              </div>
              <div className="card" style={{flex:"1 1 300px",padding:14}}>
                <div className="font-medium" style={{marginBottom:8,fontSize:14}}>최근 활동</div>
                {data.activityLog.length===0
                  ?<div className="text-sm text-muted" style={{padding:16,textAlign:"center"}}>아직 활동이 없습니다</div>
                  :data.activityLog.slice(-10).reverse().map(function(l) {
                    return (
                      <div key={l.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",borderBottom:"1px solid var(--border)"}}><span style={{fontSize:12}}>{l.emoji||"📌"}</span><span style={{flex:1,fontSize:11,lineHeight:1.3}}>{l.message.substring(0,80)}</span><span style={{fontSize:10,color:"var(--text-tertiary)",whiteSpace:"nowrap"}}>{new Date(l.createdAt).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span></div>
                    );
                  })
                }
              </div>
            </div>
          </React.Fragment>
        );
      })()}
    </div>
  );
}
