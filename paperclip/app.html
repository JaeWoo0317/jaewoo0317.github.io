                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:13,fontWeight:600}}>{a.name}</span><span className={"badge badge-"+a.status} style={{fontSize:10,padding:"0px 5px"}}>{a.status}</span></div>
                  <div style={{fontSize:11,color:"var(--text-secondary)"}}>{a.title||a.role}{mg?" · → "+mg.name:""} · <span style={{color:"var(--accent)"}}>{mi.name}</span>{a.adapterConfig&&a.adapterConfig.advisorEnabled?" · 🧠"+(MODELS[a.adapterConfig.advisorModel]||{}).name:""}{a.adapterConfig&&a.adapterConfig.webSearchEnabled?" · 🔍":""}  · {"$"+(a.spentMonthlyCents/100).toFixed(2)+"/$"+(a.budgetMonthlyCents/100).toFixed(0)}</div>
                </div>
                <button className="btn" style={{padding:"2px 6px",fontSize:10,border:"none",background:"none",color:"var(--accent)"}} onClick={()=>startEdit(a)}>✏️</button>
                <button className="btn" style={{padding:"2px 6px",fontSize:10,border:"none",background:"none",color:"var(--danger)"}} onClick={()=>del(a.id)}>🗑️</button>
              </div>
            );
          })}
        </div>}
    </div>
  );
}

function IssuesPage({ data, onUpdate }) {
  const COLS = [
    {id:"backlog",label:"Backlog",color:"var(--text-tertiary)"},
    {id:"todo",label:"To Do",color:"var(--info)"},
    {id:"in_progress",label:"진행 중",color:"var(--warning)"},
    {id:"review",label:"리뷰",color:"var(--accent)"},
    {id:"done",label:"완료",color:"var(--success)"},
  ];
  const PRIS = ["low","medium","high","urgent"];
  const [showForm,setShowForm] = useState(false);
  const [selected,setSelected] = useState(null);
  const [dragId,setDragId] = useState(null);
  const blank = {title:"",description:"",priority:"medium",assigneeAgentId:"",projectId:""};
  const [f,setF] = useState({...blank});

  const nextNumber = () => {
    const co = data.companies[0];
    if(!co) return {num:1,id:"JWAY-1"};
    const n = (co.issueCounter||0)+1;
    return {num:n,id:co.issuePrefix+"-"+n};
  };

  const create = () => {
    if(!f.title.trim()) return;
    const co = data.companies[0];
    const {num,id:identifier} = nextNumber();
    const issue = {id:uid(),companyId:co?co.id:"",projectId:f.projectId||null,goalId:null,parentId:null,title:f.title,description:f.description,status:"backlog",priority:f.priority,assigneeAgentId:f.assigneeAgentId||null,issueNumber:num,identifier:identifier,originKind:"manual",createdAt:now(),updatedAt:now(),startedAt:null,completedAt:null};
    const updatedCo = co ? {...co, issueCounter:num} : co;
    onUpdate({...data,
      issues:[...data.issues,issue],
      companies: data.companies.map(c=>c.id===co.id?updatedCo:c),
      activityLog:[...data.activityLog,{id:uid(),emoji:"📋",message:identifier+" \""+f.title+"\" 이슈 생성됨",createdAt:now()}],
    });
    setF({...blank}); setShowForm(false);
  };

  const moveIssue = (issueId, newStatus) => {
    const extra = {};
    if(newStatus==="in_progress") extra.startedAt = now();
    if(newStatus==="done") extra.completedAt = now();
    onUpdate({...data,
      issues:data.issues.map(i=>i.id===issueId?{...i,status:newStatus,updatedAt:now(),...extra}:i),
      activityLog:[...data.activityLog,{id:uid(),emoji:newStatus==="done"?"✅":"🔄",message:(data.issues.find(i=>i.id===issueId)||{}).identifier+" → "+newStatus,createdAt:now()}],
    });
    if(selected && selected.id===issueId) setSelected({...selected,status:newStatus,...extra});
  };

  const deleteIssue = (issueId) => {
    const issue = data.issues.find(i=>i.id===issueId);
    onUpdate({...data,
      issues:data.issues.filter(i=>i.id!==issueId),
      activityLog:[...data.activityLog,{id:uid(),emoji:"🗑️",message:(issue?issue.identifier:"이슈")+" 삭제됨",createdAt:now()}],
    });
    setSelected(null);
  };

  const updateIssue = (issueId, changes) => {
    onUpdate({...data,issues:data.issues.map(i=>i.id===issueId?{...i,...changes,updatedAt:now()}:i)});
    if(selected && selected.id===issueId) setSelected({...selected,...changes});
  };

  const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed="move"; };
  const onDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect="move"; };
  const onDrop = (e, colId) => { e.preventDefault(); if(dragId) moveIssue(dragId, colId); setDragId(null); };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16,height:"100%"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div className="font-bold" style={{fontSize:18}}>이슈 보드 ({data.issues.length})</div>
        <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>{showForm?"취소":"+ 이슈 생성"}</button>
      </div>

      {showForm&&(
        <div className="card" style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="input" placeholder="이슈 제목 *" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/>
          <textarea className="input" placeholder="설명 (선택)" value={f.description} onChange={e=>setF({...f,description:e.target.value})} rows={2} style={{resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}>
            <select className="input" value={f.priority} onChange={e=>setF({...f,priority:e.target.value})} style={{flex:1}}>
              <option value="low">🟢 Low</option><option value="medium">🟡 Medium</option>
              <option value="high">🔴 High</option><option value="urgent">🚨 Urgent</option>
            </select>
            <select className="input" value={f.assigneeAgentId} onChange={e=>setF({...f,assigneeAgentId:e.target.value})} style={{flex:1}}>
              <option value="">담당자 없음</option>
              {data.agents.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name}</option>)}
            </select>
            <select className="input" value={f.projectId} onChange={e=>setF({...f,projectId:e.target.value})} style={{flex:1}}>
              <option value="">프로젝트 없음</option>
              {data.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <button className="btn btn-primary" onClick={create}>이슈 생성</button>
        </div>
      )}

      <div className="kanban">
        {COLS.map(col=>{
          const colIssues = data.issues.filter(i=>i.status===col.id).sort((a,b)=>{
            const po={urgent:0,high:1,medium:2,low:3};
            return (po[a.priority]||2)-(po[b.priority]||2);
          });
          return (
            <div key={col.id} className="kanban-col">
              <div className="kanban-col-header">
                <span><span style={{color:col.color}}>●</span> {col.label}</span>
                <span className="kanban-col-count">{colIssues.length}</span>
              </div>
              <div className="kanban-col-body" onDragOver={onDragOver} onDrop={e=>onDrop(e,col.id)}>
                {colIssues.map(issue=>{
                  const agent = data.agents.find(a=>a.id===issue.assigneeAgentId);
                  return (
                    <div key={issue.id} className="kanban-card" draggable onDragStart={e=>onDragStart(e,issue.id)} onClick={()=>setSelected(issue)}>
                      <div className="kanban-card-id">{issue.identifier}</div>
                      <div className="kanban-card-title">{issue.title}</div>
                      <div className="kanban-card-footer">
                        <span className={"priority-dot priority-"+issue.priority} title={issue.priority}/>
                        {agent && <span className="kanban-card-agent">{agent.icon} {agent.name}</span>}
                        {!agent && <span className="kanban-card-agent" style={{color:"var(--text-tertiary)"}}>미배정</span>}
                        {(issue.comments||[]).length > 0 && <span className="kanban-card-agent" style={{color:"var(--accent)"}}>{"💬" + issue.comments.length}</span>}
                        {(issue.artifacts||[]).length > 0 && <span className="kanban-card-agent" style={{color:"var(--success)"}}>{"📎" + issue.artifacts.length}</span>}
                      </div>
                    </div>
                  );
                })}
                {colIssues.length===0 && <div className="text-sm text-muted" style={{padding:16,textAlign:"center",opacity:0.5}}>드래그하여 이동</div>}
              </div>
            </div>
          );
        })}
      </div>

      {selected && (
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setSelected(null)}}>
          <div className="modal">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"start",marginBottom:16}}>
              <div>
                <div className="text-sm text-muted">{selected.identifier}</div>
                <h2 style={{margin:0}}>{selected.title}</h2>
              </div>
              <button className="btn" style={{padding:"4px 8px",fontSize:12}} onClick={()=>setSelected(null)}>✕</button>
            </div>

            {selected.description && <div className="text-sm" style={{marginBottom:16,padding:12,background:"var(--bg-secondary)",borderRadius:"var(--radius)",whiteSpace:"pre-wrap"}}>{selected.description}</div>}

            {(selected.artifacts||[]).length > 0 && (
              <div style={{marginBottom:16}}>
                <div className="text-sm font-medium" style={{marginBottom:8}}>{"📎 아티팩트 (" + selected.artifacts.length + ")"}</div>
                <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:360,overflowY:"auto"}}>
                  {selected.artifacts.map(function(a) {
                    return (
                      <div key={a.id} style={{padding:10,background:"var(--bg-secondary)",borderRadius:6,borderLeft:"3px solid var(--success)"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,flexWrap:"wrap",gap:4}}>
                          <span className="text-sm font-medium">{artifactEmoji(a.type) + " " + a.title}</span>
                          <span style={{fontSize:10,color:"var(--text-tertiary)"}}>{a.agentName + " · " + new Date(a.createdAt).toLocaleString("ko-KR")}</span>
                        </div>
                        {a.description && <div style={{fontSize:11,color:"var(--text-tertiary)",marginBottom:6}}>{a.description}</div>}
                        <details style={{fontSize:11}}>
                          <summary style={{cursor:"pointer",color:"var(--text-tertiary)",userSelect:"none"}}>{"내용 미리보기 (" + a.content.length + "자)"}</summary>
                          <pre style={{maxHeight:200,overflow:"auto",background:"var(--bg-primary)",padding:8,borderRadius:4,marginTop:6,fontSize:10,whiteSpace:"pre-wrap",wordBreak:"break-all"}}>{a.content.substring(0,2000) + (a.content.length > 2000 ? "\n... (총 " + a.content.length + "자, 다운로드하여 전체 확인)" : "")}</pre>
                        </details>
                        <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
                          <button className="btn btn-primary" style={{padding:"4px 10px",fontSize:11}} onClick={function(){downloadArtifact(a)}}>⬇ 다운로드</button>
                          {a.type === "html" && <button className="btn" style={{padding:"4px 10px",fontSize:11}} onClick={function(){previewHtmlArtifact(a)}}>🔍 HTML 미리보기</button>}
                          {a.type === "markdown" && <button className="btn" style={{padding:"4px 10px",fontSize:11}} onClick={function(){previewHtmlArtifact(a)}}>📖 렌더링</button>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {(selected.comments||[]).length > 0 && (
              <div style={{marginBottom:16}}>
                <div className="text-sm font-medium" style={{marginBottom:8}}>{"💬 코멘트 (" + selected.comments.length + ")"}</div>
                <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:200,overflowY:"auto"}}>
                  {selected.comments.map(function(c) {
                    var emoji = c.type === "delegation" ? "🔀" : c.type === "review" ? "✅" : "💬";
                    return (
                      <div key={c.id} style={{padding:"8px 10px",background:"var(--bg-secondary)",borderRadius:6,borderLeft:"3px solid " + (c.type === "delegation" ? "var(--warning)" : c.type === "review" ? "var(--success)" : "var(--accent)")}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                          <span className="text-sm font-medium">{emoji + " " + c.agentName}</span>
                          <span style={{fontSize:10,color:"var(--text-tertiary)"}}>{new Date(c.createdAt).toLocaleString("ko-KR")}</span>
                        </div>
                        <div style={{fontSize:12,lineHeight:1.4}}>{c.content}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <div className="text-sm font-medium" style={{marginBottom:4}}>상태</div>
                <div className="move-btns">
                  {COLS.map(c=><button key={c.id} className={"move-btn"+(selected.status===c.id?" current":"")} onClick={()=>moveIssue(selected.id,c.id)}>{c.label}</button>)}
                </div>
              </div>
              <div>
                <div className="text-sm font-medium" style={{marginBottom:4}}>우선순위</div>
                <div className="move-btns">
                  {PRIS.map(p=><button key={p} className={"move-btn"+(selected.priority===p?" current":"")} onClick={()=>updateIssue(selected.id,{priority:p})}>{p==="low"?"🟢 Low":p==="medium"?"🟡 Medium":p==="high"?"🔴 High":"🚨 Urgent"}</button>)}
                </div>
              </div>
              <div>
                <div className="text-sm font-medium" style={{marginBottom:4}}>담당자</div>
                <select className="input" value={selected.assigneeAgentId||""} onChange={e=>updateIssue(selected.id,{assigneeAgentId:e.target.value||null})}>
                  <option value="">미배정</option>
                  {data.agents.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <div className="text-sm text-muted" style={{flex:1}}>생성: {new Date(selected.createdAt).toLocaleString("ko-KR")}</div>
                <button className="btn" style={{padding:"4px 12px",fontSize:12,color:"var(--danger)"}} onClick={()=>deleteIssue(selected.id)}>삭제</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ========== 가상 사무실 (CSS 픽셀 사무실 스타일) ==========
function OfficePage({ data }) {
  const [tick, setTick] = useState(0);
  useEffect(() => { const t = setInterval(() => setTick(x => x+1), 1000); return () => clearInterval(t); }, []);

  // 책상 위치 추적 (위임 화살표용)
  const officeRef = React.useRef(null);
  const deskRefs = React.useRef({});
  const [arrows, setArrows] = useState([]);  // {id, x1,y1,x2,y2, kind, expireAt}
  const lastSeenComment = React.useRef({});
  const lastSeenArtifact = React.useRef({});

  const agents = data.agents || [];
  const allComments = (data.issues || []).flatMap(i => (i.comments || []).map(c => ({...c, issueTitle: i.title, issueId: i.id})));
  const allArtifacts = (data.issues || []).flatMap(i => (i.artifacts || []).map(a => ({...a, issueTitle: i.title})));

  // 새 코멘트/아티팩트 감지 → 화살표 생성 (writer → assignee)
  React.useEffect(function(){
    if (!officeRef.current) return;
    var newArrows = [];
    var ob = officeRef.current.getBoundingClientRect();

    function deskCenter(agentId) {
      var el = deskRefs.current[agentId];
      if (!el) return null;
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width/2 - ob.left, y: r.top + r.height/2 - ob.top };
    }

    // 신규 코멘트 = 위임/대화로 간주
    (data.issues || []).forEach(function(issue){
      (issue.comments || []).forEach(function(c){
        if (lastSeenComment.current[c.id]) return;
        lastSeenComment.current[c.id] = true;
        var fromAgent = c.agentId;
        var toAgent = issue.assigneeAgentId;
        if (!fromAgent || !toAgent || fromAgent === toAgent) return;
        var p1 = deskCenter(fromAgent), p2 = deskCenter(toAgent);
        if (!p1 || !p2) return;
        newArrows.push({ id: 'c'+c.id, x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, kind:'comment', expireAt: Date.now()+3500 });
      });
      // 아티팩트 = 결과물 제출
      (issue.artifacts || []).forEach(function(ar){
        if (lastSeenArtifact.current[ar.id]) return;
        lastSeenArtifact.current[ar.id] = true;
        var fromAgent = ar.agentId;
        var toAgent = issue.assigneeAgentId;
        if (!fromAgent || !toAgent || fromAgent === toAgent) return;
        var p1 = deskCenter(fromAgent), p2 = deskCenter(toAgent);
        if (!p1 || !p2) return;
        newArrows.push({ id: 'r'+ar.id, x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, kind:'artifact', expireAt: Date.now()+4000 });
      });
    });
    if (newArrows.length) setArrows(function(prev){ return prev.concat(newArrows); });
  }, [data]);

  // 만료된 화살표 정리
  React.useEffect(function(){
    var t = setInterval(function(){
      var now = Date.now();
      setArrows(function(prev){ return prev.filter(function(a){return a.expireAt > now}); });
    }, 500);
    return function(){ clearInterval(t); };
  }, []);

  // 에이전트 별 최신 코멘트 (가상 말풍선용)
  const latestByAgent = {};
  allComments.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(c => {
    if (!latestByAgent[c.agentId]) latestByAgent[c.agentId] = c;
  });

  // 활동 로그 (최신순)
  const activityFeed = (data.activityLog || []).slice(-30).reverse();

  // 가상 시계 (실제 시간으로)
  const now = new Date();
  const clock = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const dayCount = Math.max(1, Math.ceil((Date.now() - new Date(data.companies[0]?.createdAt || Date.now()).getTime()) / 86400000));

  // 통계
  const workingCount = agents.filter(a => a.status === "working").length;
  const totalArtifacts = allArtifacts.length;
  const totalComments = allComments.length;

  // 책상 배치 — 에이전트 수에 따라 grid columns 동적
  const gridCols = agents.length <= 4 ? 2 : agents.length <= 6 ? 3 : agents.length <= 9 ? 3 : 4;

  // 역할별 색상 매핑
  var roleColors = {
    ceo:'#a78bfa', cto:'#a78bfa', cmo:'#a78bfa', coo:'#a78bfa', pm:'#a78bfa',
    engineer:'#60a5fa', developer:'#60a5fa',
    designer:'#f472b6',
    marketer:'#fb923c', writer:'#fb923c',
    analyst:'#34d399', researcher:'#34d399',
    secretary:'#fbbf24',
  };
  var deskColor = function(role){ return roleColors[(role||'').toLowerCase()] || '#94a3b8'; };

  // 상태별 이모지
  var statusEmoji = function(s){ return s === 'working' ? '✍️' : s === 'thinking' ? '💭' : s === 'reviewing' ? '👀' : '💤'; };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* 상단 대시보드 바 */}
      <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center",padding:"14px 18px",background:"linear-gradient(135deg,#1e1b4b,#312e81)",borderRadius:12,color:"white",boxShadow:"0 4px 20px rgba(99,102,241,0.2)"}}>
        <div style={{fontSize:20,fontWeight:800}}>🏢 가상 사무실</div>
        <div style={{flex:1}}/>
        <div style={{display:"flex",gap:14,alignItems:"center",fontSize:13}}>
          <div><span style={{opacity:0.7}}>DAY</span> <strong style={{fontSize:16,color:"#fde047"}}>{dayCount}</strong></div>
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.2)"}}/>
          <div><span style={{opacity:0.7}}>TIME</span> <strong style={{fontSize:16,color:"#fde047",fontFamily:"monospace"}}>{clock}</strong></div>
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.2)"}}/>
          <div><span style={{opacity:0.7}}>WORKING</span> <strong style={{fontSize:16,color:workingCount>0?"#34d399":"#94a3b8"}}>{workingCount}/{agents.length}</strong></div>
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.2)"}}/>
          <div><span style={{opacity:0.7}}>📎</span> <strong style={{fontSize:16,color:"#f472b6"}}>{totalArtifacts}</strong></div>
          <div style={{width:1,height:20,background:"rgba(255,255,255,0.2)"}}/>
          <div><span style={{opacity:0.7}}>💬</span> <strong style={{fontSize:16,color:"#a78bfa"}}>{totalComments}</strong></div>
        </div>
      </div>

      {agents.length === 0 ? (
        <div className="card" style={{textAlign:"center",padding:40,color:"var(--text-secondary)"}}>
          🪑 빈 사무실입니다. <strong>👥 에이전트</strong> 페이지에서 팀원을 추가하세요.
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:16}}>
          {/* 사무실 본체 */}
          <div ref={officeRef} style={{background:"linear-gradient(135deg,#fef3c7 0%,#fde68a 50%,#fed7aa 100%)",borderRadius:16,padding:20,minHeight:480,position:"relative",backgroundImage:"linear-gradient(135deg,#fef3c7 0%,#fde68a 50%,#fed7aa 100%), repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(180,83,9,0.06) 39px, rgba(180,83,9,0.06) 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(180,83,9,0.06) 39px, rgba(180,83,9,0.06) 40px)",border:"3px solid #92400e",boxShadow:"inset 0 0 60px rgba(180,83,9,0.15), 0 8px 32px rgba(0,0,0,0.1)"}}>
            {/* 회의 테이블 (장식) */}
            <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:160,height:80,background:"radial-gradient(ellipse,#fbbf24,#d97706)",borderRadius:"50%",opacity:0.3,zIndex:0,boxShadow:"inset 0 0 20px rgba(0,0,0,0.2)"}}>
              <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:32,opacity:0.5}}>☕</div>
            </div>

            {/* 책상 그리드 */}
            <div style={{display:"grid",gridTemplateColumns:`repeat(${gridCols},1fr)`,gap:12,position:"relative",zIndex:1}}>
              {agents.map(function(a){
                var c = deskColor(a.role);
                var latest = latestByAgent[a.id];
                var isWorking = a.status === 'working';
                return (
                  <div key={a.id} ref={function(el){deskRefs.current[a.id]=el}} style={{position:"relative",padding:"10px 8px 8px",background:"rgba(255,255,255,0.85)",borderRadius:8,border:"2px solid "+c,boxShadow:isWorking?"0 0 0 3px "+c+"55, 0 4px 12px rgba(0,0,0,0.1)":"0 2px 6px rgba(0,0,0,0.08)",transition:"all 0.3s",animation:isWorking?"deskPulse 2s infinite":"none"}}>
                    {/* 말풍선 (최신 코멘트가 있고 working일 때) */}
                    {latest && (
                      <div style={{position:"absolute",top:-32,left:"50%",transform:"translateX(-50%)",background:"white",border:"1px solid "+c,borderRadius:10,padding:"3px 8px",fontSize:10,whiteSpace:"nowrap",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",boxShadow:"0 2px 8px rgba(0,0,0,0.1)",zIndex:5,color:"#1f2937"}} title={latest.content}>
                        💬 {latest.content.slice(0, 28)}{latest.content.length > 28 ? '…' : ''}
                      </div>
                    )}
                    {/* 캐릭터 */}
                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:36,lineHeight:1,marginBottom:4,position:"relative",display:"inline-block"}}>
                        {a.icon || '🤖'}
                        {/* 상태 인디케이터 */}
                        <span style={{position:"absolute",top:-4,right:-12,fontSize:14,background:"white",borderRadius:"50%",padding:1,border:"1px solid #e5e7eb"}}>{statusEmoji(a.status)}</span>
                      </div>
                      <div style={{fontSize:11,fontWeight:700,color:"#1f2937",lineHeight:1.2}}>{a.name}</div>
                      <div style={{fontSize:9,color:"#6b7280",marginTop:2,textTransform:"uppercase",letterSpacing:0.3}}>{a.role || 'general'}</div>
                      {/* 책상 (장식) */}
                      <div style={{marginTop:4,height:4,background:"linear-gradient(180deg,#92400e,#78350f)",borderRadius:2,boxShadow:"0 1px 2px rgba(0,0,0,0.2)"}}/>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* 위임/제출 화살표 SVG 오버레이 */}
            {arrows.length > 0 && (
              <svg style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:10}}>
                <defs>
                  <marker id="arrowhead-comment" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#a78bfa"/>
                  </marker>
                  <marker id="arrowhead-artifact" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#ec4899"/>
                  </marker>
                </defs>
                {arrows.map(function(ar){
                  var color = ar.kind === 'artifact' ? '#ec4899' : '#a78bfa';
                  var marker = ar.kind === 'artifact' ? 'url(#arrowhead-artifact)' : 'url(#arrowhead-comment)';
                  return (
                    <g key={ar.id}>
                      <line x1={ar.x1} y1={ar.y1} x2={ar.x2} y2={ar.y2} stroke={color} strokeWidth="2.5" strokeDasharray="6 4" markerEnd={marker} style={{animation:"arrowFade 3.5s ease-out forwards"}}/>
                      <text x={(ar.x1+ar.x2)/2} y={(ar.y1+ar.y2)/2 - 6} fill={color} fontSize="14" fontWeight="700" textAnchor="middle" style={{animation:"arrowFade 3.5s ease-out forwards"}}>
                        {ar.kind === 'artifact' ? '📎' : '💬'}
                      </text>
                    </g>
                  );
                })}
              </svg>
            )}
          </div>

          {/* 활동 로그 사이드바 */}
          <div style={{background:"#0f172a",borderRadius:12,padding:14,maxHeight:600,overflowY:"auto",color:"#cbd5e1"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:10,borderBottom:"1px solid #1e293b"}}>
              <span style={{display:"inline-block",width:8,height:8,background:"#10b981",borderRadius:"50%",animation:"deskPulse 1.4s infinite"}}/>
              <strong style={{color:"white",fontSize:13}}>활동 로그 LIVE</strong>
              <span style={{marginLeft:"auto",fontSize:10,color:"#64748b"}}>{activityFeed.length}건</span>
            </div>
            {activityFeed.length === 0 ? (
              <div style={{color:"#64748b",fontSize:12,textAlign:"center",padding:20}}>아직 활동이 없습니다.<br/>💓 Heartbeat을 실행해보세요.</div>
            ) : (
              activityFeed.map(function(ev){
                var t = new Date(ev.createdAt);
                var hh = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
                return (
                  <div key={ev.id} style={{display:"flex",gap:8,padding:"6px 0",borderBottom:"1px dashed #1e293b",fontSize:11,lineHeight:1.5}}>
                    <span style={{color:"#64748b",fontFamily:"monospace",flexShrink:0}}>{hh}</span>
                    <span style={{flexShrink:0}}>{ev.emoji || '•'}</span>
                    <span style={{color:"#cbd5e1",wordBreak:"break-all"}}>{ev.message}</span>
                  </div>
                );
              })
            )}
          </div>
        </div>
      )}

      <style>{`
        @keyframes deskPulse {
          0%,100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.6; transform: scale(0.95); }
        }
        @keyframes arrowFade {
          0% { opacity: 0; transform: scale(0.7); }
          15% { opacity: 1; transform: scale(1); }
          70% { opacity: 1; }
          100% { opacity: 0; }
        }
      `}</style>

      {/* 하단 안내 */}
      <div style={{padding:"10px 14px",background:"#fef3c7",borderRadius:8,fontSize:11,color:"#78350f",lineHeight:1.6}}>
        💡 <strong>가상 사무실</strong> — 에이전트들이 책상에서 일하는 모습을 시각화합니다. 💓 Heartbeat 실행 중에는 status가 working으로 바뀌며 책상에 펄스 효과가 표시됩니다. 말풍선은 최근 코멘트를 보여줍니다.
      </div>
    </div>
  );
}

// ========== 지식 네트워크 (D3 force-directed graph) ==========
function BrainGraphPage({ data, onUpdate }) {
  const svgRef = React.useRef(null);
  const fileInputRef = React.useRef(null);
  const [selected, setSelected] = useState(null);
  const [showAgents, setShowAgents] = useState(true);
  const [showIssues, setShowIssues] = useState(true);
  const [showComments, setShowComments] = useState(true);
  const [showArtifacts, setShowArtifacts] = useState(true);
  const [showBrainPacks, setShowBrainPacks] = useState(true);
  const [linkAgentId, setLinkAgentId] = useState("");

  var brainPacks = data.brainPacks || [];

  // Brain Pack import
  function importBrainPack(e) {
    var files = e.target.files;
    if (!files || !files.length) return;
    var loaded = [];
    var pending = files.length;
    Array.from(files).forEach(function(f){
      var r = new FileReader();
      r.onload = function(ev){
        var content = ev.target.result || "";
        var name = f.name.replace(/\.(md|txt|json)$/i, "");
        loaded.push({
          id: uid(),
          name: name,
          fileName: f.name,
          content: content.slice(0, 50000),  // 50KB 제한
          size: content.length,
          tags: [],
          attachedAgentIds: linkAgentId ? [linkAgentId] : [],
          createdAt: now(),
        });
        pending--;
        if (pending === 0) {
          onUpdate(Object.assign({}, data, {
            brainPacks: (data.brainPacks || []).concat(loaded),
            activityLog: (data.activityLog || []).concat([{
              id: uid(), emoji: "🧠",
              message: "Brain Pack " + loaded.length + "개 import: " + loaded.map(function(p){return p.name}).join(", "),
              createdAt: now()
            }])
          }));
          alert("✅ Brain Pack " + loaded.length + "개 추가 완료\n\n" + loaded.map(function(p){return "• "+p.name+" ("+Math.round(p.size/1024)+"KB)"}).join("\n") + (linkAgentId ? "\n\n선택한 에이전트에 연결됨." : "\n\n에이전트에 연결하려면 노드 클릭 → 에이전트 선택"));
        }
      };
      r.readAsText(f);
    });
    e.target.value = "";
  }

  function deleteBrainPack(id) {
    if (!confirm("Brain Pack을 삭제하시겠습니까?")) return;
    onUpdate(Object.assign({}, data, {
      brainPacks: (data.brainPacks || []).filter(function(p){return p.id !== id}),
    }));
    setSelected(null);
  }

  function attachBrainPackTo(packId, agentId) {
    onUpdate(Object.assign({}, data, {
      brainPacks: (data.brainPacks || []).map(function(p){
        if (p.id !== packId) return p;
        var ids = p.attachedAgentIds || [];
        if (ids.indexOf(agentId) !== -1) return Object.assign({}, p, {attachedAgentIds: ids.filter(function(x){return x !== agentId})});
        return Object.assign({}, p, {attachedAgentIds: ids.concat([agentId])});
      })
    }));
  }

  React.useEffect(function() {
    if (!window.d3 || !svgRef.current) return;
    var d3 = window.d3;
    var nodes = [];
    var links = [];

    if (showAgents) {
      data.agents.forEach(function(a){
        nodes.push({ id: 'a:'+a.id, type:'agent', label: a.icon+' '+a.name, sub: a.role, color: '#6366f1', size: 28, raw: a });
      });
      data.agents.forEach(function(a){
        if (a.reportsTo && data.agents.find(function(x){return x.id===a.reportsTo})) {
          links.push({ source:'a:'+a.id, target:'a:'+a.reportsTo, kind:'reports', color:'#6366f1' });
        }
      });
    }
    if (showIssues) {
      data.issues.forEach(function(i){
        nodes.push({ id: 'i:'+i.id, type:'issue', label: '📋 '+i.title.slice(0,30), sub: i.status, color: i.status==='done'?'#10b981':i.status==='in_progress'?'#f59e0b':'#94a3b8', size: 18, raw: i });
        if (showAgents && i.assigneeAgentId) {
          links.push({ source:'a:'+i.assigneeAgentId, target:'i:'+i.id, kind:'assigned', color:'#6366f1' });
        }
      });
    }
    if (showComments) {
      data.issues.forEach(function(i){
        (i.comments||[]).slice(-12).forEach(function(c){
          var cid = 'c:'+c.id;
          nodes.push({ id: cid, type:'comment', label: '💬 '+(c.content||'').slice(0,18), sub: c.agentName, color:'#a78bfa', size:8, raw:c });
          if (showAgents) links.push({ source:'a:'+c.agentId, target: cid, kind:'wrote', color:'#a78bfa' });
          if (showIssues) links.push({ source: cid, target: 'i:'+i.id, kind:'on', color:'#cbd5e1' });
        });
      });
    }
    if (showArtifacts) {
      data.issues.forEach(function(i){
        (i.artifacts||[]).forEach(function(ar){
          var aid = 'r:'+ar.id;
          nodes.push({ id: aid, type:'artifact', label: '📎 '+(ar.title||'').slice(0,20), sub: ar.type, color: ar.type==='html'?'#10b981':ar.type==='json'?'#f59e0b':ar.type==='markdown'?'#8b5cf6':'#94a3b8', size: 14, raw: ar });
          if (showAgents && ar.agentId) links.push({ source:'a:'+ar.agentId, target: aid, kind:'made', color:'#ec4899' });
          if (showIssues) links.push({ source: aid, target: 'i:'+i.id, kind:'for', color:'#cbd5e1' });
        });
      });
    }
    if (showBrainPacks) {
      brainPacks.forEach(function(p){
        var bid = 'b:'+p.id;
        nodes.push({ id: bid, type:'brainpack', label: '🧠 '+(p.name||'').slice(0,22), sub: Math.round((p.size||0)/1024)+'KB', color:'#22d3ee', size: 20, raw: p });
        if (showAgents && p.attachedAgentIds) {
          p.attachedAgentIds.forEach(function(aid){
            if (data.agents.find(function(x){return x.id===aid})) {
              links.push({ source: bid, target: 'a:'+aid, kind:'injected', color:'#22d3ee' });
            }
          });
        }
      });
    }

    var svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();
    var W = svgRef.current.clientWidth || 800;
    var H = 540;
    svg.attr('viewBox', '0 0 '+W+' '+H);

    if (nodes.length === 0) {
      svg.append('text').attr('x', W/2).attr('y', H/2).attr('text-anchor','middle').attr('fill','#94a3b8').attr('font-size', 14).text('표시할 노드가 없습니다. Heartbeat을 실행해 데이터를 쌓으세요.');
      return;
    }

    var sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(function(d){return d.id}).distance(function(l){ return l.kind==='reports'?80:l.kind==='wrote'?40:l.kind==='made'?50:60; }))
      .force('charge', d3.forceManyBody().strength(-180))
      .force('center', d3.forceCenter(W/2, H/2))
      .force('collide', d3.forceCollide().radius(function(d){return d.size+6}));

    var link = svg.append('g').attr('stroke-opacity', 0.5).selectAll('line').data(links).enter().append('line')
      .attr('stroke', function(d){return d.color}).attr('stroke-width', function(d){return d.kind==='reports'?2:1});

    var node = svg.append('g').selectAll('g').data(nodes).enter().append('g').style('cursor','pointer')
      .on('click', function(ev, d){ setSelected(d); })
      .call(d3.drag()
        .on('start', function(ev,d){ if(!ev.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
        .on('drag', function(ev,d){ d.fx=ev.x; d.fy=ev.y; })
        .on('end', function(ev,d){ if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

    node.append('circle').attr('r', function(d){return d.size}).attr('fill', function(d){return d.color}).attr('stroke','white').attr('stroke-width', 2);
    node.append('text').text(function(d){return d.label}).attr('x', function(d){return d.size+4}).attr('y', 4).attr('font-size', 10).attr('fill','#1f2937');

    sim.on('tick', function(){
      link.attr('x1', function(d){return d.source.x}).attr('y1', function(d){return d.source.y}).attr('x2', function(d){return d.target.x}).attr('y2', function(d){return d.target.y});
      node.attr('transform', function(d){return 'translate('+d.x+','+d.y+')'});
    });

    return function(){ sim.stop(); };
  }, [data, showAgents, showIssues, showComments, showArtifacts, showBrainPacks]);

  var stats = {
    agents: data.agents.length,
    issues: data.issues.length,
    comments: (data.issues||[]).reduce(function(s,i){return s+(i.comments||[]).length},0),
    artifacts: (data.issues||[]).reduce(function(s,i){return s+(i.artifacts||[]).length},0),
    brainPacks: brainPacks.length,
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",background:"linear-gradient(135deg,#0f172a,#1e293b)",borderRadius:12,color:"white",flexWrap:"wrap"}}>
        <div style={{fontSize:20,fontWeight:800}}>🧠 지식 네트워크 LIVE</div>
        <div style={{fontSize:12,color:"#94a3b8"}}>에이전트·이슈·코멘트·아티팩트·Brain Pack 관계 그래프</div>
        <div style={{flex:1}}/>
        <div style={{display:"flex",gap:14,fontSize:12,alignItems:"center",flexWrap:"wrap"}}>
          <div><span style={{color:"#94a3b8"}}>👥</span> <strong>{stats.agents}</strong></div>
          <div><span style={{color:"#94a3b8"}}>📋</span> <strong>{stats.issues}</strong></div>
          <div><span style={{color:"#94a3b8"}}>💬</span> <strong>{stats.comments}</strong></div>
          <div><span style={{color:"#94a3b8"}}>📎</span> <strong>{stats.artifacts}</strong></div>
          <div><span style={{color:"#94a3b8"}}>🧠</span> <strong style={{color:"#22d3ee"}}>{stats.brainPacks}</strong></div>
        </div>
      </div>

      {/* Brain Pack import 영역 */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"linear-gradient(90deg,#cffafe,#ecfeff)",border:"1px dashed #22d3ee",borderRadius:10,flexWrap:"wrap"}}>
        <span style={{fontSize:18}}>🧠</span>
        <strong style={{fontSize:13,color:"#155e75"}}>Brain Pack 주입</strong>
        <span style={{fontSize:11,color:"#0e7490"}}>지식(.md/.txt/.json) 파일을 에이전트에 주입해서 추가 컨텍스트로 활용</span>
        <div style={{flex:1}}/>
        <select value={linkAgentId} onChange={function(e){setLinkAgentId(e.target.value)}} style={{padding:"6px 10px",border:"1px solid #67e8f9",borderRadius:8,fontSize:12,background:"white",color:"#155e75"}}>
          <option value="">전체 (에이전트 미연결)</option>
          {data.agents.map(function(a){ return <option key={a.id} value={a.id}>{a.icon} {a.name} ({a.role})</option> })}
        </select>
        <button onClick={function(){fileInputRef.current && fileInputRef.current.click()}} style={{padding:"6px 14px",background:"#0891b2",color:"white",border:"none",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer"}}>📥 파일 선택 (.md/.txt/.json)</button>
        <input ref={fileInputRef} type="file" accept=".md,.txt,.json,.markdown" multiple style={{display:"none"}} onChange={importBrainPack}/>
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        {[{k:'showAgents',v:showAgents,s:setShowAgents,l:'👥 에이전트',c:'#6366f1'},{k:'showIssues',v:showIssues,s:setShowIssues,l:'📋 이슈',c:'#94a3b8'},{k:'showComments',v:showComments,s:setShowComments,l:'💬 코멘트',c:'#a78bfa'},{k:'showArtifacts',v:showArtifacts,s:setShowArtifacts,l:'📎 아티팩트',c:'#ec4899'},{k:'showBrainPacks',v:showBrainPacks,s:setShowBrainPacks,l:'🧠 Brain Pack',c:'#22d3ee'}].map(function(f){
          return (
            <button key={f.k} onClick={function(){f.s(!f.v)}} style={{padding:"6px 12px",borderRadius:18,border:"1px solid "+(f.v?f.c:"#e5e7eb"),background:f.v?f.c:"white",color:f.v?"white":"#6b7280",cursor:"pointer",fontSize:12,fontWeight:600}}>{f.l}</button>
          );
        })}
        <div style={{marginLeft:"auto",fontSize:11,color:"#9ca3af"}}>💡 노드를 끌어 옮길 수 있고, 클릭하면 상세를 봅니다</div>
      </div>

      <div style={{display:"grid",gridTemplateColumns: selected ? "1fr 320px" : "1fr",gap:12}}>
        <div className="card" style={{padding:0,overflow:"hidden",background:"radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%)"}}>
          <svg ref={svgRef} style={{width:"100%",height:540,display:"block"}}/>
        </div>
        {selected && (
          <div className="card" style={{padding:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontWeight:700}}>{selected.label}</div>
              <button onClick={function(){setSelected(null)}} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#9ca3af"}}>✕</button>
            </div>
            <div style={{fontSize:11,color:"#9ca3af",marginBottom:10,padding:"3px 8px",background:"#f3f4f6",borderRadius:10,display:"inline-block"}}>{selected.type} · {selected.sub||''}</div>

            {/* Brain Pack 전용 — 에이전트 연결/삭제 */}
            {selected.type === 'brainpack' && (
              <div style={{marginBottom:12,padding:10,background:"#cffafe",borderRadius:8,border:"1px solid #67e8f9"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#155e75",marginBottom:6}}>📡 연결된 에이전트</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                  {data.agents.map(function(a){
                    var attached = (selected.raw.attachedAgentIds || []).indexOf(a.id) !== -1;
                    return (
                      <button key={a.id} onClick={function(){attachBrainPackTo(selected.raw.id, a.id)}} style={{padding:"3px 8px",borderRadius:14,border:"1px solid "+(attached?"#0891b2":"#cbd5e1"),background:attached?"#0891b2":"white",color:attached?"white":"#475569",fontSize:11,cursor:"pointer",fontWeight:600}}>
                        {attached ? '✓ ' : ''}{a.icon} {a.name}
                      </button>
                    );
                  })}
                </div>
                <button onClick={function(){deleteBrainPack(selected.raw.id)}} style={{padding:"4px 10px",background:"#fee2e2",color:"#b91c1c",border:"1px solid #fca5a5",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer"}}>🗑️ 삭제</button>
              </div>
            )}

            {/* 내용 미리보기 */}
            {selected.type === 'brainpack' ? (
              <div>
                <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>📄 내용 ({Math.round((selected.raw.size||0)/1024)}KB)</div>
                <pre style={{background:"#f9fafb",padding:10,borderRadius:8,fontSize:11,whiteSpace:"pre-wrap",wordBreak:"break-all",maxHeight:280,overflowY:"auto",color:"#374151"}}>{(selected.raw.content || '').slice(0, 3000)}{(selected.raw.content || '').length > 3000 ? '\n...(중략)' : ''}</pre>
              </div>
            ) : (
              <pre style={{background:"#f9fafb",padding:10,borderRadius:8,fontSize:11,whiteSpace:"pre-wrap",wordBreak:"break-all",maxHeight:380,overflowY:"auto",color:"#374151"}}>{JSON.stringify(selected.raw, null, 2).slice(0, 2000)}</pre>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function HeartbeatPage({ data, onUpdate }) {
  const [running, setRunning] = useState(null);
  const [lastResult, setLastResult] = useState(null);
  const [runPrompt, setRunPrompt] = useState("");
  const [collabProgress, setCollabProgress] = useState(null);
  const [collabRounds, setCollabRounds] = useState(1); // 💸 비용 절감: 기본 1라운드
  const [collabDelay, setCollabDelay] = useState(10); // rate limit 회피 지연(초)

  // 스케줄링 상태
  const [scheduleActive, setScheduleActive] = useState(false);
  const [scheduleMode, setScheduleMode] = useState("collaboration"); // "all" | "collaboration"
  const [scheduleInterval, setScheduleInterval] = useState(10); // 분 단위
  const [scheduleRounds, setScheduleRounds] = useState(2);
  const [nextRunAt, setNextRunAt] = useState(null);
  const [countdown, setCountdown] = useState("");
  const [scheduleRunCount, setScheduleRunCount] = useState(0);
  const scheduleRef = React.useRef(null);
  const countdownRef = React.useRef(null);
  const runningRef = React.useRef(false);

  const activeAgents = data.agents.filter(function(a) { return a.status !== "paused"; });
  const recentRuns = (data.heartbeatRuns || []).slice(-20).reverse();

  const runAgent = async (agent) => {
    setRunning(agent.id);
    setLastResult(null);
    var freshData = load() || data;
    var freshAgent = freshData.agents.find(function(a) { return a.id === agent.id; }) || agent;
    var result = await executeHeartbeat(freshAgent, freshData, function(d) { save(d); onUpdate(d); }, runPrompt);
    setLastResult(result);
    setRunning(null);
  };

  const runAll = async () => {
    for (var i = 0; i < activeAgents.length; i++) {
      setRunning(activeAgents[i].id);
      var freshData = load() || data;
      var freshAgent = freshData.agents.find(function(a) { return a.id === activeAgents[i].id; }) || activeAgents[i];
      var result = await executeHeartbeat(freshAgent, freshData, function(d) { save(d); onUpdate(d); }, runPrompt);
      setLastResult(result);
    }
    setRunning(null);
  };

  const runCollab = async () => {
    setRunning("collaboration");
    setLastResult(null);
    setCollabProgress({ round: 0, maxRounds: collabRounds, phase: "준비 중", agentName: "", agentIcon: "" });
    var freshData = load() || data;
    var result;
    if (DEMO_MODE) {
      // 데모 모드: 실제 API 호출 없이 시뮬레이션
      result = await runDemoSimulation(freshData, function(d) { save(d); onUpdate(d); }, function(progress) { setCollabProgress(progress); });
    } else {
      result = await runCollaborationHeartbeat(freshData, function(d) { save(d); onUpdate(d); }, collabRounds, function(progress) { setCollabProgress(progress); }, collabDelay);
    }
    setLastResult(result);
    setRunning(null);
    setCollabProgress(null);
  };

  // 스케줄 실행 함수
  const executeScheduledRun = async () => {
    if (runningRef.current) return;
    runningRef.current = true;
    var freshData = load();
    if (!freshData) { runningRef.current = false; return; }
    if (scheduleMode === "collaboration") {
      setRunning("collaboration");
      setCollabProgress({ round: 0, maxRounds: scheduleRounds, phase: "준비 중", agentName: "", agentIcon: "" });
      await runCollaborationHeartbeat(freshData, function(d) { save(d); onUpdate(d); }, scheduleRounds, function(progress) { setCollabProgress(progress); }, collabDelay);
      setCollabProgress(null);
    } else {
      var agents = freshData.agents.filter(function(a) { return a.status !== "paused" && a.status !== "working"; });
      for (var i = 0; i < agents.length; i++) {
        setRunning(agents[i].id);
        var fd = load() || freshData;
        await executeHeartbeat(agents[i], fd, function(d) { save(d); onUpdate(d); });
      }
    }
    setRunning(null);
    setScheduleRunCount(function(c) { return c + 1; });
    runningRef.current = false;
  };

  const startSchedule = () => {
    setScheduleActive(true);
    setScheduleRunCount(0);
    var intervalMs = scheduleInterval * 60 * 1000;
    var next = new Date(Date.now() + intervalMs);
    setNextRunAt(next);

    // 카운트다운 타이머
    if (countdownRef.current) clearInterval(countdownRef.current);
    countdownRef.current = setInterval(function() {
      var remaining = next.getTime() - Date.now();
      if (remaining <= 0) {
        setCountdown("실행 중...");
      } else {
        var mins = Math.floor(remaining / 60000);
        var secs = Math.floor((remaining % 60000) / 1000);
        setCountdown(mins + ":" + (secs < 10 ? "0" : "") + secs);
      }
    }, 1000);

    // 실행 인터벌
    if (scheduleRef.current) clearInterval(scheduleRef.current);
    scheduleRef.current = setInterval(function() {
      var newNext = new Date(Date.now() + intervalMs);
      setNextRunAt(newNext);
      executeScheduledRun();
    }, intervalMs);
  };

  const stopSchedule = () => {
    setScheduleActive(false);
    setNextRunAt(null);
    setCountdown("");
    if (scheduleRef.current) { clearInterval(scheduleRef.current); scheduleRef.current = null; }
    if (countdownRef.current) { clearInterval(countdownRef.current); countdownRef.current = null; }
  };

  useEffect(function() { return function() { if (scheduleRef.current) clearInterval(scheduleRef.current); if (countdownRef.current) clearInterval(countdownRef.current); }; }, []);

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="font-bold" style={{fontSize:18}}>Heartbeat 엔진</div>
          <span className={"hb-status " + (scheduleActive ? "hb-active" : "hb-stopped")}>
            {scheduleActive && <span className="pulse"/>}
            {scheduleActive ? "스케줄 실행 중" : "수동 모드"}
          </span>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button className="btn" style={{fontSize:12,color:"var(--warning)"}} title="모든 에이전트를 idle로 리셋" onClick={function(){
            var fresh = load() || data;
            var upd = {...fresh, agents: fresh.agents.map(function(a){return {...a, status: "idle", updatedAt: now()}})};
            save(upd); onUpdate(upd);
          }}>🔄 전체 리셋</button>
          <button className="btn btn-primary" onClick={runAll} disabled={running}>
            {running && running !== "collaboration" ? "실행 중..." : "🔄 전체"}
          </button>
          {running === "collaboration" ? (
            <button className="btn" style={{background:"var(--danger)",color:"white",fontWeight:600}} onClick={function(){ COLLAB_ABORT.current = true; }}>
              ⏹ 중단
            </button>
          ) : (
            <button className="btn" style={{background:"var(--accent-light)",color:"var(--accent)",fontWeight:600}} onClick={runCollab} disabled={running}>
              🤝 협업
            </button>
          )}
          <select className="input" value={collabRounds} onChange={function(e){setCollabRounds(parseInt(e.target.value))}} style={{width:75,fontSize:12}} disabled={running==="collaboration"}>
            <option value={1}>1라운드</option>
            <option value={2}>2라운드</option>
            <option value={3}>3라운드</option>
          </select>
          <select className="input" value={collabDelay} onChange={function(e){setCollabDelay(parseInt(e.target.value))}} style={{width:95,fontSize:12}} disabled={running==="collaboration"} title="에이전트 간 지연 (rate limit 회피)">
            <option value={0}>지연 없음</option>
            <option value={5}>⏳ 5초</option>
            <option value={10}>⏳ 10초</option>
            <option value={15}>⏳ 15초</option>
            <option value={20}>⏳ 20초</option>
          </select>
        </div>
      </div>

      {/* 스케줄링 패널 */}
      <div className="card" style={{padding:14,border:scheduleActive?"2px solid var(--success)":"2px solid var(--border)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:scheduleActive?12:0,flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:18}}>⏰</span>
            <div className="font-medium" style={{fontSize:14}}>자동 스케줄</div>
            {scheduleActive && <span className="badge badge-done" style={{fontSize:10}}>{"실행 "+scheduleRunCount+"회"}</span>}
          </div>
          {!scheduleActive ? (
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <select className="input" value={scheduleMode} onChange={function(e){setScheduleMode(e.target.value)}} style={{width:120,fontSize:12}}>
                <option value="collaboration">🤝 협업 모드</option>
                <option value="all">🔄 전체 모드</option>
              </select>
              {scheduleMode==="collaboration" && (
                <select className="input" value={scheduleRounds} onChange={function(e){setScheduleRounds(parseInt(e.target.value))}} style={{width:75,fontSize:12}}>
                  <option value={1}>1라운드</option>
                  <option value={2}>2라운드</option>
                  <option value={3}>3라운드</option>
                </select>
              )}
              <select className="input" value={scheduleInterval} onChange={function(e){setScheduleInterval(parseInt(e.target.value))}} style={{width:90,fontSize:12}}>
                <option value={1}>1분</option>
                <option value={3}>3분</option>
                <option value={5}>5분</option>
                <option value={10}>10분</option>
                <option value={15}>15분</option>
                <option value={30}>30분</option>
                <option value={60}>60분</option>
              </select>
              <button className="btn btn-primary" style={{fontSize:12}} onClick={startSchedule} disabled={running}>{"▶️ 시작"}</button>
            </div>
          ) : (
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:24,fontWeight:700,color:"var(--accent)",fontVariantNumeric:"tabular-nums"}}>{countdown || "--:--"}</div>
                <div style={{fontSize:10,color:"var(--text-tertiary)"}}>다음 실행까지</div>
              </div>
              <button className="btn" style={{fontSize:12,color:"var(--danger)"}} onClick={stopSchedule}>{"⏹ 중지"}</button>
            </div>
          )}
        </div>
        {scheduleActive && (
          <div style={{display:"flex",gap:16,fontSize:12,color:"var(--text-secondary)",flexWrap:"wrap"}}>
            <span>{"모드: " + (scheduleMode==="collaboration" ? "🤝 협업 "+scheduleRounds+"라운드" : "🔄 전체")}</span>
            <span>{"간격: " + scheduleInterval + "분"}</span>
            {nextRunAt && <span>{"다음: " + nextRunAt.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span>}
          </div>
        )}
      </div>

      <div className="card" style={{padding:14}}>
        <div className="font-medium" style={{marginBottom:8,fontSize:14}}>📝 이번 실행 지시사항</div>
        <textarea className="input" placeholder="이번 Heartbeat에만 적용할 지시사항 (예: '이슈 우선순위를 재검토해줘', '진행 상황을 상세히 보고해줘')" value={runPrompt} onChange={function(e){setRunPrompt(e.target.value)}} rows={2} style={{resize:"vertical",fontSize:13}}/>
        <div className="text-sm text-muted" style={{marginTop:4}}>비워두면 기본 동작으로 실행됩니다</div>
      </div>

      {collabProgress && (
        <div className="card" style={{padding:14,border:"2px solid "+(collabProgress.waiting?"var(--warning)":"var(--accent)"),background:collabProgress.waiting?"#fff8e1":"var(--accent-light)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:20}}>{collabProgress.agentIcon || "🤝"}</span>
            <div>
              <div className="font-medium" style={{color:collabProgress.waiting?"var(--warning)":"var(--accent)"}}>{"🤝 협업 라운드 " + collabProgress.round + "/" + collabProgress.maxRounds + " — " + (collabProgress.phase === "manager" ? "매니저 검토" : "실무자 실행")}</div>
              <div className="text-sm">{collabProgress.waiting ? collabProgress.agentName : (collabProgress.agentName ? collabProgress.agentName + " 실행 중..." : "준비 중...")}</div>
            </div>
          </div>
        </div>
      )}

      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>에이전트별 수동 실행</div>
        {activeAgents.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>활성 에이전트가 없습니다</div>
          : activeAgents.map(function(agent) {
            var mi = MODELS[agent.adapterConfig ? agent.adapterConfig.model : ""] || { name: "?" };
            var isRunning = running === agent.id;
            var budgetPct = agent.budgetMonthlyCents > 0 ? Math.round(agent.spentMonthlyCents / agent.budgetMonthlyCents * 100) : 0;
            var overBudget = agent.budgetMonthlyCents > 0 && agent.spentMonthlyCents >= agent.budgetMonthlyCents;
            var pendingApproval = hasPendingApproval(data, agent.id);
            var blocked = overBudget || pendingApproval;
            return (
              <div key={agent.id} className="table-row">
                <span style={{fontSize:20}}>{agent.icon || "🤖"}</span>
                <div style={{flex:1}}>
                  <div className="font-medium">{agent.name}</div>
                  <div className="text-sm text-muted">{mi.name}{agent.adapterConfig&&agent.adapterConfig.advisorEnabled?" + 🧠"+(MODELS[agent.adapterConfig.advisorModel]||{}).name:""} · {agent.title || agent.role}</div>
                </div>
                <span className={"badge badge-" + agent.status}>{isRunning ? "실행 중..." : agent.status}</span>
                <span className="text-sm text-muted">{"$" + (agent.spentMonthlyCents / 100).toFixed(2) + " / $" + (agent.budgetMonthlyCents / 100).toFixed(0)}</span>
                {agent.status === "error" || agent.status === "working"
                  ? <button className="btn" style={{padding:"4px 10px",fontSize:11,color:"var(--warning)"}} title="상태를 idle로 리셋" onClick={function(){
                      var fresh = load() || data;
                      var upd = {...fresh, agents: fresh.agents.map(function(a){return a.id===agent.id?{...a,status:"idle",updatedAt:now()}:a})};
                      save(upd); onUpdate(upd);
                    }}>🔄 리셋</button>
                  : null}
                {overBudget
                  ? <span className="badge badge-error">예산 초과</span>
                  : pendingApproval
                  ? <span className="badge badge-paused" style={{fontSize:11}}>🛡️ 승인 대기</span>
                  : <button className="btn" style={{padding:"4px 12px",fontSize:12}} onClick={function(){runAgent(agent)}} disabled={isRunning || agent.status === "working"}>
                      {isRunning ? "⏳" : "▶️ 실행"}
                    </button>
                }
              </div>
            );
          })
        }
      </div>

      {lastResult && (
        <div className="card">
          <div className="font-medium" style={{marginBottom:8}}>마지막 실행 결과</div>
          {lastResult.success
            ? <div>
                <div style={{display:"flex",gap:8,marginBottom:8}}>
                  <span className="badge badge-done">성공</span>
                  <span className="cost-pill">{"$" + (lastResult.costCents / 100).toFixed(3)}</span>
                  {lastResult.run && <span className="token-pill">{(lastResult.run.inputTokens||0) + "+" + (lastResult.run.outputTokens||0) + " tokens"}</span>}
                </div>
                {lastResult.run && lastResult.run.responseExcerpt && (
                  <div className="run-log">{lastResult.run.responseExcerpt}</div>
                )}
              </div>
            : <div>
                <span className="badge badge-error">실패</span>
                <div className="text-sm" style={{marginTop:8,color:"var(--danger)"}}>{lastResult.error}</div>
              </div>
          }
        </div>
      )}

      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>실행 기록 (최근 20건)</div>
        {recentRuns.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>아직 실행 기록이 없습니다</div>
          : recentRuns.map(function(run) {
            var agent = data.agents.find(function(a) { return a.id === run.agentId; });
            return (
              <div key={run.id} className="run-card">
                <div className="run-card-header">
                  {run.mode === "collaboration"
                    ? <span>🤝</span>
                    : <span>{agent ? agent.icon : "🤖"}</span>
                  }
                  <span className="text-sm font-medium">{run.mode === "collaboration" ? "협업 Heartbeat" : (agent ? agent.name : "?")}</span>
                  <span className={"badge badge-" + (run.status === "completed" ? "done" : "error")}>{run.status}</span>
                  {run.mode === "collaboration" && <span className="badge" style={{fontSize:10,background:"#e0f2fe",color:"#0284c7"}}>{run.rounds + "라운드"}</span>}
                  {run.costCents > 0 && <span className="cost-pill">{"$" + (run.costCents / 100).toFixed(3)}</span>}
                  {run.attempts > 1 && <span className="badge" style={{fontSize:10,background:"var(--warning-light)",color:"var(--warning)"}}>{run.attempts + "회 시도"}</span>}
                  {run.advisorEnabled && <span className="badge" style={{fontSize:10,background:"#f0e6ff",color:"#7c3aed"}}>{"🧠 " + (MODELS[run.advisorModel]||{}).name + (run.advisorCalls ? " x" + run.advisorCalls : "")}</span>}
                  {run.inputTokens > 0 && <span className="token-pill">{run.inputTokens + "+" + (run.outputTokens || 0)}</span>}
                  <span className="text-sm text-muted" style={{marginLeft:"auto"}}>{new Date(run.startedAt).toLocaleString("ko-KR")}</span>
                </div>
                {run.summary && <div className="text-sm">{run.summary}</div>}
                {run.error && <div className="text-sm" style={{color:"var(--danger)"}}>{run.error}</div>}
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

function OrgChartPage({ data }) {
  var co = data.companies[0];
  var agents = data.agents;
  var roots = agents.filter(function(a) { return !a.reportsTo || !agents.find(function(x) { return x.id === a.reportsTo; }); });

  function renderNode(agent, depth) {
    var children = agents.filter(function(a) { return a.reportsTo === agent.id; });
    var mi = MODELS[agent.adapterConfig ? agent.adapterConfig.model : ""] || { name: "?" };
    var isLeaf = children.length === 0;
    return (
      <div key={agent.id} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
        <div style={{background:"var(--bg-primary)",border:"2px solid "+(agent.status==="working"?"var(--info)":agent.status==="error"?"var(--danger)":"var(--border)"),borderRadius:12,padding:"12px 16px",textAlign:"center",minWidth:120,position:"relative",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <div style={{fontSize:28}}>{agent.icon||"🤖"}</div>
          <div style={{fontSize:13,fontWeight:600,marginTop:4}}>{agent.name}</div>
          <div style={{fontSize:11,color:"var(--text-secondary)"}}>{agent.title||agent.role}</div>
          <div style={{display:"flex",gap:4,justifyContent:"center",marginTop:6}}>
            <span className={"badge badge-"+agent.status} style={{fontSize:10,padding:"0 5px"}}>{agent.status}</span>
            <span style={{fontSize:10,color:"var(--accent)",background:"var(--accent-light)",padding:"0 5px",borderRadius:4}}>{mi.name}</span>
          </div>
        </div>
        {children.length > 0 && (
          <React.Fragment>
            <div style={{width:2,height:16,background:"var(--border)"}}/>
            {children.length > 1 && <div style={{height:2,background:"var(--border)",width:Math.max(children.length*140-40,100),alignSelf:"center"}}/>}
            <div style={{display:"flex",gap:24,justifyContent:"center"}}>
              {children.map(function(c) {
                return (
                  <div key={c.id} style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                    <div style={{width:2,height:16,background:"var(--border)"}}/>
                    {renderNode(c, depth+1)}
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}
      </div>
    );
  }

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div className="font-bold" style={{fontSize:18}}>🏛️ 조직도</div>
      {co && (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,overflowX:"auto",padding:"16px 0"}}>
          <div style={{background:"var(--accent)",color:"white",borderRadius:12,padding:"12px 20px",textAlign:"center",minWidth:140,boxShadow:"0 2px 8px rgba(99,102,241,0.2)"}}>
            <div style={{fontSize:24}}>🏢</div>
            <div style={{fontSize:14,fontWeight:700,marginTop:4}}>{co.name}</div>
            <div style={{fontSize:11,opacity:0.8}}>{data.agents.length}명의 에이전트</div>
          </div>
          {roots.length > 0 && (
            <React.Fragment>
              <div style={{width:2,height:20,background:"var(--border)"}}/>
              {roots.length > 1 && <div style={{height:2,background:"var(--border)",width:Math.max(roots.length*140-40,100)}}/>}
              <div style={{display:"flex",gap:24,justifyContent:"center"}}>
                {roots.map(function(r) {
                  return (
                    <div key={r.id} style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                      <div style={{width:2,height:16,background:"var(--border)"}}/>
                      {renderNode(r, 0)}
                    </div>
                  );
                })}
              </div>
            </React.Fragment>
          )}
          {agents.length === 0 && <div className="card text-sm text-muted" style={{padding:40,textAlign:"center",marginTop:16}}>에이전트를 추가하면 조직도가 표시됩니다</div>}
        </div>
      )}
    </div>
  );
}

function ActivityPage({ data }) {
  const logs = (data.activityLog || []).slice(-50).reverse();
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div className="font-bold" style={{fontSize:18}}>📜 활동 로그 ({data.activityLog.length}건)</div>
      {logs.length === 0
        ? <div className="card text-sm text-muted" style={{padding:40,textAlign:"center"}}>아직 활동이 없습니다</div>
        : <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:8}}>
          {logs.map(function(l) {
            return (
              <div key={l.id} className="card" style={{padding:"8px 12px",display:"flex",alignItems:"flex-start",gap:8}}>
                <span style={{fontSize:14,flexShrink:0}}>{l.emoji || "📌"}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,lineHeight:1.4}}>{l.message}</div>
                  <div style={{fontSize:10,color:"var(--text-tertiary)",marginTop:2}}>{new Date(l.createdAt).toLocaleString("ko-KR")}</div>
                </div>
              </div>
            );
          })}
        </div>
      }
    </div>
  );
}

function CostsPage({ data }) {
  const co = data.companies[0];
  const n = new Date();
  const monthEvents = data.costEvents.filter(function(e) {
    var d = new Date(e.occurredAt);
    return d.getUTCFullYear() === n.getUTCFullYear() && d.getUTCMonth() === n.getUTCMonth();
  });
  const totalCostCents = monthEvents.reduce(function(s, e) { return s + (e.costCents || 0); }, 0);
  const totalCalls = monthEvents.length;
  const totalInputTokens = monthEvents.reduce(function(s, e) { return s + (e.inputTokens || 0); }, 0);
  const totalOutputTokens = monthEvents.reduce(function(s, e) { return s + (e.outputTokens || 0); }, 0);
  const avgCost = totalCalls > 0 ? totalCostCents / totalCalls : 0;
  const budgetCents = co ? co.budgetMonthlyCents : 0;
  const budgetPct = budgetCents > 0 ? Math.min(100, Math.round(totalCostCents / budgetCents * 100)) : 0;

  // Agent cost breakdown
  const agentCosts = data.agents.map(function(agent) {
    var agentEvents = monthEvents.filter(function(e) { return e.agentId === agent.id; });
    var cost = agentEvents.reduce(function(s, e) { return s + (e.costCents || 0); }, 0);
    var calls = agentEvents.length;
    var tokens = agentEvents.reduce(function(s, e) { return s + (e.inputTokens || 0) + (e.outputTokens || 0); }, 0);
    var pct = agent.budgetMonthlyCents > 0 ? Math.min(100, Math.round(agent.spentMonthlyCents / agent.budgetMonthlyCents * 100)) : 0;
    var over = agent.budgetMonthlyCents > 0 && agent.spentMonthlyCents >= agent.budgetMonthlyCents;
    return { agent: agent, cost: cost, calls: calls, tokens: tokens, pct: pct, over: over };
  });

  // Model breakdown
  var modelMap = {};
  monthEvents.forEach(function(e) {
    if (!modelMap[e.model]) modelMap[e.model] = { calls: 0, cost: 0, inputTokens: 0, outputTokens: 0 };
    modelMap[e.model].calls++;
    modelMap[e.model].cost += (e.costCents || 0);
    modelMap[e.model].inputTokens += (e.inputTokens || 0);
    modelMap[e.model].outputTokens += (e.outputTokens || 0);
  });
  var modelColors = { "claude-opus-4-6": "#8b5cf6", "claude-sonnet-4-6": "#6366f1", "claude-haiku-4-5-20251001": "#06b6d4" };
  var modelEntries = Object.keys(modelMap).map(function(k) {
    return { model: k, name: (MODELS[k] || {}).name || k, color: modelColors[k] || "#94a3b8", ...modelMap[k] };
  }).sort(function(a, b) { return b.cost - a.cost; });

  // Daily chart (last 14 days)
  var dailyData = [];
  for (var i = 13; i >= 0; i--) {
    var day = new Date(n);
    day.setDate(day.getDate() - i);
    var dayStr = day.toISOString().slice(0, 10);
    var dayCost = data.costEvents.filter(function(e) {
      return e.occurredAt && e.occurredAt.slice(0, 10) === dayStr;
    }).reduce(function(s, e) { return s + (e.costCents || 0); }, 0);
    dailyData.push({ label: (day.getMonth() + 1) + "/" + day.getDate(), cost: dayCost });
  }
  var maxDailyCost = Math.max.apply(null, dailyData.map(function(d) { return d.cost; })) || 1;

  // Recent events
  var recentEvents = data.costEvents.slice(-30).reverse();

  // 💸 절감 팁 체크 (사용자 설정 분석)
  var advisorAgents = data.agents.filter(function(a){return a.adapterConfig && a.adapterConfig.advisorEnabled}).length;
  var webSearchAgents = data.agents.filter(function(a){return a.adapterConfig && a.adapterConfig.webSearchEnabled}).length;
  var sonnetAgents = data.agents.filter(function(a){return a.adapterConfig && a.adapterConfig.model === "claude-sonnet-4-6"}).length;
  var tips = [];
  if (advisorAgents > 2) tips.push({icon:"🧠",msg:"Advisor를 " + advisorAgents + "명이 사용 중. 리더(CEO/CTO) 1~2명만 활성화하면 " + Math.round((advisorAgents-2)*15) + "% 절감"});
  if (webSearchAgents > 2) tips.push({icon:"🔍",msg:"웹 검색을 " + webSearchAgents + "명이 사용 중. 리서치 역할(분석가/마케터)만 활성화하면 " + Math.round((webSearchAgents-2)*10) + "% 절감"});
  if (sonnetAgents > 0) tips.push({icon:"⚡",msg:"Sonnet 4.6 사용 " + sonnetAgents + "명. Haiku 4.5로 변경 시 " + Math.round(sonnetAgents*30) + "% 절감"});
  if (data.agents.length > 6) tips.push({icon:"👥",msg:"에이전트 " + data.agents.length + "명. 핵심 5~6명으로 줄이면 " + Math.round((data.agents.length-6)*12) + "% 절감"});

  return (
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      {/* 💸 절감 팁 */}
      {tips.length > 0 && (
        <div className="card" style={{padding:14,background:"linear-gradient(135deg,#fef3c7,#fff7ed)",border:"1px solid #fbbf24"}}>
          <div style={{fontWeight:700,fontSize:14,color:"#92400e",marginBottom:10}}>💸 비용 절감 팁 ({tips.length}건)</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {tips.map(function(t,i){return <div key={i} style={{display:"flex",gap:8,fontSize:13,color:"#78350f"}}><span>{t.icon}</span><span>{t.msg}</span></div>})}
          </div>
          <div style={{fontSize:11,color:"#b45309",marginTop:10}}>💡 ⚙️ 설정 → <strong>💸 전체 에이전트 저비용 모드로</strong> 버튼으로 일괄 적용 가능</div>
        </div>
      )}

      {/* Summary Cards */}
      <div className="card-grid">
        <div className="card metric-card">
          <div className="metric-label">이번 달 비용</div>
          <div className="metric-value">{"$" + (totalCostCents / 100).toFixed(2)}</div>
          <div className="metric-sub">{"예산 $" + (budgetCents / 100).toFixed(0) + " (" + budgetPct + "%)"}</div>
          <div className="progress-bar" style={{marginTop:8}}>
            <div className="progress-fill" style={{width:budgetPct+"%",background:budgetPct>=90?"var(--danger)":budgetPct>=70?"var(--warning)":"var(--success)"}}/>
          </div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">API 호출 수</div>
          <div className="metric-value">{totalCalls}</div>
          <div className="metric-sub">이번 달</div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">총 토큰</div>
          <div className="metric-value">{((totalInputTokens + totalOutputTokens) / 1000).toFixed(1) + "K"}</div>
          <div className="metric-sub">{"입력 " + (totalInputTokens/1000).toFixed(1) + "K · 출력 " + (totalOutputTokens/1000).toFixed(1) + "K"}</div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">평균 호출 비용</div>
          <div className="metric-value">{"$" + (avgCost / 100).toFixed(3)}</div>
          <div className="metric-sub">호출당</div>
        </div>
      </div>

      <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
        {/* Agent Cost Table */}
        <div className="card" style={{flex:"1 1 400px"}}>
          <div className="font-medium" style={{marginBottom:12}}>에이전트별 비용</div>
          {agentCosts.length === 0
            ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>에이전트가 없습니다</div>
            : agentCosts.map(function(ac) {
              var mi = MODELS[ac.agent.adapterConfig ? ac.agent.adapterConfig.model : ""] || { name: "?" };
              return (
                <div key={ac.agent.id} className="table-row" style={{flexWrap:"wrap"}}>
                  <span style={{fontSize:20}}>{ac.agent.icon || "🤖"}</span>
                  <div style={{flex:"1 1 120px",minWidth:0}}>
                    <div className="text-sm font-medium">{ac.agent.name}</div>
                    <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{mi.name}{ac.agent.adapterConfig&&ac.agent.adapterConfig.advisorEnabled?" + 🧠":""}  · {ac.calls}회</div>
                  </div>
                  <div style={{flex:"1 1 160px",minWidth:120}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span className="text-sm font-medium">{"$" + (ac.agent.spentMonthlyCents / 100).toFixed(2)}</span>
                      <span className="text-sm text-muted">{"/ $" + (ac.agent.budgetMonthlyCents / 100).toFixed(0)}</span>
                    </div>
                    <div className="progress-bar">
                      <div className="progress-fill" style={{width:ac.pct+"%",background:ac.over?"var(--danger)":ac.pct>=70?"var(--warning)":"var(--accent)"}}/>
                    </div>
                  </div>
                  {ac.over && <span className="badge badge-error" style={{fontSize:11}}>초과</span>}
                </div>
              );
            })
          }
        </div>

        {/* Model Breakdown */}
        <div className="card" style={{flex:"1 1 300px"}}>
          <div className="font-medium" style={{marginBottom:12}}>모델별 비용</div>
          {totalCostCents > 0 && (
            <div className="model-bar" style={{marginBottom:16}}>
              {modelEntries.map(function(m) {
                var widthPct = Math.max(2, Math.round(m.cost / totalCostCents * 100));
                return <div key={m.model} className="model-segment" title={m.name + ": $" + (m.cost / 100).toFixed(2)} style={{width:widthPct+"%",background:m.color}}/>;
              })}
            </div>
          )}
          {modelEntries.length === 0
            ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>데이터가 없습니다</div>
            : modelEntries.map(function(m) {
              return (
                <div key={m.model} className="table-row">
                  <span style={{width:10,height:10,borderRadius:"50%",background:m.color,flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <div className="text-sm font-medium">{m.name}</div>
                    <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{m.calls + "회 · " + ((m.inputTokens + m.outputTokens) / 1000).toFixed(1) + "K tokens"}</div>
                  </div>
                  <span className="text-sm font-medium">{"$" + (m.cost / 100).toFixed(2)}</span>
                  <span className="text-sm text-muted">{totalCostCents > 0 ? Math.round(m.cost / totalCostCents * 100) + "%" : "0%"}</span>
                </div>
              );
            })
          }
        </div>
      </div>

      {/* Daily Cost Chart */}
      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>일별 비용 추이 (최근 14일)</div>
        <div className="daily-chart">
          {dailyData.map(function(d, idx) {
            var heightPct = d.cost > 0 ? Math.max(4, (d.cost / maxDailyCost) * 100) : 0;

              <div key={idx} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}>
